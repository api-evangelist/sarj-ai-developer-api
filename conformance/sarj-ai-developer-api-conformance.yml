standards:
  - id: openapi-3.1
    conforms: true
    evidence: All four harvested specs declare openapi 3.1.0.
  - id: oauth2
    conforms: true
    partial: true
    evidence: >-
      authorization_code + PKCE, published via RFC 8414 metadata at
      https://platform-api.sarj.ai/.well-known/oauth-authorization-server. Applies only to the MCP transport; the REST
      APIs are bearer-API-key only.
  - id: rfc8414-oauth-authorization-server-metadata
    conforms: true
    evidence: 200 application/json at /.well-known/oauth-authorization-server with issuer and endpoint set.
  - id: rfc7591-dynamic-client-registration
    conforms: true
    evidence: registration_endpoint published at https://platform-api.sarj.ai/api/v1/oauth/register.
  - id: rfc7636-pkce
    conforms: true
    evidence: code_challenge_methods_supported = ["S256"].
  - id: rfc9728-oauth-protected-resource-metadata
    conforms: false
    evidence: >-
      /.well-known/oauth-protected-resource returns 404 on every host, even though the MCP endpoint answers 401 with
      WWW-Authenticate: Bearer. MCP clients must be told the authorization server out of band.
  - id: oidc
    conforms: false
    partial: true
    evidence: >-
      scopes_supported includes "openid" but no /.well-known/openid-configuration is served, no id_token is
      advertised, and response_types_supported is ["code"] only. Not an OIDC provider.
  - id: mcp
    conforms: true
    evidence: >-
      Hosted MCP server over HTTP transport at https://platform-api.sarj.ai/api/v1/mcp, documented with Claude Code
      and Cursor install instructions. tools/list is auth-gated (401), so protocol version was not observed.
  - id: a2a
    conforms: true
    grade: conformant
    evidence: >-
      Agent card served at https://platform-docs.sarj.ai/.well-known/agent-card.json; capabilities is an object,
      protocolVersion is present, skills is an array. Deviations recorded in a2a/sarj-ai-developer-api-a2a.yml.
  - id: llms-txt
    conforms: true
    evidence: https://platform-docs.sarj.ai/llms.txt returns 200 text/plain with Docs and OpenAPI Specs sections.
  - id: agent-skills
    conforms: true
    evidence: >-
      Provider-published skill at /.well-known/agent-skills/sarj/skill.md, advertised from the agent card.
  - id: rfc9457-problem-details
    conforms: false
    evidence: >-
      Errors use a vendor envelope {"error": {"type", "message"}, "meta": {"request_id"}} with content-type
      application/json, not application/problem+json. Typed and discriminated, but not the IETF shape.
  - id: rfc9116-security-txt
    conforms: false
    evidence: >-
      /.well-known/security.txt returns 404 on platform-api, platform-docs, www.sarj.ai, sarj.ai, blog and
      403/401 on platform and the two speech hosts. Re-probed 2026-09-11, unchanged.
  - id: rfc8594-sunset-header
    conforms: false
    evidence: No Sunset or Deprecation headers declared in any spec; no deprecation policy published.
  - id: e164-phone-numbers
    conforms: true
    evidence: CreateCallRequest.phone_number documented and exemplified as E.164 ("+966512345678").
  - id: openai-audio-api-compatibility
    conforms: true
    evidence: >-
      Provider states both speech APIs are drop-in compatible with the OpenAI Audio Transcriptions and Speech APIs.
      Corroborated by the harvested specs: POST /openai/v1/audio/transcriptions and POST /v1/audio/speech with
      model/voice/input/response_format parameters.
  - id: iso8601-timestamps
    conforms: true
    evidence: created_at, started_at, ended_at are ISO 8601 UTC in the spec and webhook examples.
  - id: cursor-pagination
    conforms: true
    partial: true
    evidence: >-
      cursor + limit query parameters on list operations in the platform spec. Absent from the public developer API,
      which exposes no list operation.
  - id: agent-skills-discovery-0.2.0
    conforms: true
    evidence: >-
      /.well-known/agent-skills/index.json declares $schema
      https://schemas.agentskills.io/discovery/0.2.0/schema.json, lists one skill, and publishes a sha256
      digest that we verified against the harvested skill.md byte-for-byte. Found 2026-09-11.
  - id: rfc8288-web-linking
    conforms: true
    evidence: >-
      platform-docs.sarj.ai returns a Link header on every response advertising six discovery documents by
      relation type (llms-txt, llms-full-txt, api-catalog, mcp-server-card, agent-card, agent-skills). Four
      of the six resolve. This is a genuine, unusual piece of discovery hygiene.
  - id: rfc9727-api-catalog
    conforms: false
    evidence: >-
      /.well-known/api-catalog is advertised by rel="api-catalog" in the docs host's Link header but returns
      404 (9-byte text/plain) on every host. Advertised, not served.
  - id: mcp-server-card
    conforms: true
    partial: true
    evidence: >-
      /.well-known/mcp/server-card.json on platform-docs.sarj.ai returns a server card for the documentation
      MCP server, whose anonymous tools/list returns 200 with three tools and full inputSchemas. The card
      lists two tools and omits submit_feedback, so the published card and the running server disagree.
  - id: openapi-3.1-deprecated-keyword
    conforms: false
    evidence: >-
      PublicCallDetail.recording_url is deprecated in prose ("DEPRECATED — use permanent_recording_url") but
      carries no `deprecated: true` keyword, which OpenAPI 3.1 supports on both schemas and operations. No
      tooling can see the deprecation.
  - id: rfc3339-scheduled-times
    conforms: true
    evidence: >-
      CreateCallRequest.scheduled_at and RescheduleCallRequest.scheduled_at are documented as "RFC 3339 with
      timezone offset" with a worked example (2026-05-01T15:30:00+03:00), and ISO 8601 durations (PT2H, P3D)
      are accepted for schedule-config intervals.
  - id: iana-timezone-database
    conforms: true
    evidence: CreateScheduleConfigRequest.timezone is an IANA timezone name (example "Asia/Riyadh").
  - id: idempotency
    conforms: false
    evidence: >-
      No Idempotency-Key header or equivalent in any of the four specs. Re-checked 2026-09-11 against the
      refreshed 7-operation developer spec: none of the four mutating operations accepts a replay key.
      POST /calls is a billable, non-idempotent side-effecting operation. conventions/ records
      idempotency.coverage: none.
domain_standard_signature:
  market: conversational voice AI / outbound telephony
  declared_in_contract: false
  candidates_checked:
    - standard: E.164 numbering plan (ITU-T)
      found: true
      where: CreateCallRequest.phone_number, documented and exemplified
      note: >-
        Real and load-bearing, but E.164 is a universal numbering format rather than a market-specific
        interchange standard — it earns the conformance entry above, not a domain-standard credit.
    - standard: OpenAI Audio API shape
      found: true
      where: POST /openai/v1/audio/transcriptions and POST /v1/audio/speech on the speech hosts
      note: >-
        The closest thing to a domain standard Sarj.ai actually implements: a de-facto interface standard for
        speech, declared in the contract (paths, model/voice/input/response_format parameters) and claimed in
        the docs as drop-in compatibility. It is a vendor-originated convention rather than a standards-body
        specification, recorded as such.
    - standard: TM Forum / CAMARA telecom APIs
      found: false
    - standard: SIP / RFC 3261 signalling surfaces
      found: partial
      where: >-
        The platform spec carries SIP trunk administration operations (organization-sip tag), so SIP is used
        beneath the product, but no SIP-standard contract is exposed to callers.
  verdict: >-
    No market-specific domain standard is declared by the contract. This market has no mature interchange
    standard for outbound AI voice calling, so nothing is invented to fill the slot — reward-only, not penalised.
