findings:
  - id: strong-agent-standards-weak-web-standards
    detail: >-
      Sarj conforms to the newest agent-facing standards — MCP, A2A, agent skills, llms.txt — while missing older,
      cheaper web-API hygiene: no security.txt, no RFC 9457 errors, no protected-resource metadata, no Sunset headers.
      The agent surface is ahead of the API surface.
