        - id: wrong-method-and-path-for-cancel-and-reschedule
          severity: high
          detail: >-
            The skill's API Endpoints table lists `DELETE /calls/{call_id}` for "Cancel pending scheduled
            call" and `PATCH /calls/{call_id}` for "Reschedule pending call". Neither exists in the OpenAPI.
