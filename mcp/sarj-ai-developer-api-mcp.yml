findings:
  - id: docs-server-card-understates-the-server
    detail: >-
      The published /.well-known/mcp/server-card.json lists two tools; the live tools/list returns three
      (submit_feedback is missing from the card). The card is a static snapshot, not generated from the
      running server.
  - id: product-tools-lag-the-contract
    detail: >-
      The public REST contract grew from 3 to 7 operations between 2026-08 and 2026-09 — cancel, reschedule,
      recording redirect and schedule configs all shipped — and the MCP server still exposes only createCall
      and getCall. The provider's own updated Agent Skill tells agents to cancel and reschedule calls and to
      create retry policies, none of which has a tool behind it.
