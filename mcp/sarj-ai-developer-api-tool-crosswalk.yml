findings:
  - id: agent-surface-narrower-than-rest
    detail: >-
      Two MCP tools against 118 published REST operations. The MCP server is a deliberate, tightly-scoped projection of
      the 3-operation developer API, not a projection of the platform. Batch calling and the speech APIs are both named
      as agent use cases in the provider's own Agent Skill but have no tool behind them.
  - id: no-divergence
    detail: >-
      No mcp_only tools. Every tool has a public REST operation behind it, so an agent's tool contract and the
      documented HTTP contract cannot drift apart.
  - id: three-tier-spec-exposure
    detail: >-
      Sarj publishes three concentric OpenAPI documents: a curated 3-operation developer API, a 99-operation platform
      API served unauthenticated at the API host root, and a 204-operation internal API linked from llms.txt. Only the
      first is documented. An agent following llms.txt — which lists both openapi.json and openapi-internal.json under
      "OpenAPI Specs" — is pointed at all of it.
  - id: internal-spec-publicly-linked
    detail: >-
      https://platform-docs.sarj.ai/api-reference/openapi-internal.json returns 200 and is referenced from the
      provider's own llms.txt. It describes user and organization administration, role assignment, phone-number
      provisioning and SIP management under a SarjJwtAuth scheme. Whether this is intentional is the provider's call
      to make, but it is worth putting in front of them: an llms.txt entry is an explicit invitation for agents to
      read it.
