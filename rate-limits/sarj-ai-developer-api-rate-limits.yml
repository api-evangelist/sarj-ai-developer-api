    detail: >-
      An agent driving createCall has no way to know how much headroom it has. The only feedback is a 429 after
      the fact, with no Retry-After, so backoff has to be guessed. Publishing RateLimit-* response headers
      (RFC 9331 style) would be the single cheapest agent-readiness upgrade available here.
