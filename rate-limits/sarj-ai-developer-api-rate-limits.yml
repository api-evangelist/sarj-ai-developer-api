exhaustion:
  status_code: 429
  error_type: call_limit_exceeded
  envelope: '{"error": {"type": "call_limit_exceeded", "message": "...", "phone_number": "...", "call_limit": N}, "meta": {"request_id": "..."}}'
  scope: per-destination-phone-number
  retry_after_header: false
  source_operation: createCall
  detail: >-
    The 429 body is the only published limit signal, and it is unusually informative for a body-only signal: it
    names the offending `phone_number` and the integer `call_limit` that was reached. The limit is per
    destination number rather than per key or per account — a consumer-protection cap on how many times one
    person may be dialed, not a throughput cap. Its value is not published in advance and no Retry-After tells
    the caller when the window resets.
