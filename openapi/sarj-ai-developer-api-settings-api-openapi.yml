openapi: 3.2.0
info:
  title: Sarj.ai Voice Settings API
  version: 1.0.0
tags:
- name: Settings
paths:
  /v1/settings/voices:
    get:
      tags:
      - Settings
      summary: Get Voices
      operationId: settingsGetVoices
      parameters:
      - name: language
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/Language'
          description: Language code (en or ar)
        description: Language code (en or ar)
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TTSVoice'
                title: Response Settingsgetvoices
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - Settings
      summary: Create Voice
      operationId: settingsCreateVoice
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTTSVoice'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSVoice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/voices/list:
    post:
      tags:
      - Settings
      summary: List Voices
      operationId: settingsListVoices
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListVoicesRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListVoicesResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/voices/{voice_id}:
    get:
      tags:
      - Settings
      summary: Get Voice
      operationId: settingsGetVoice
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSVoice'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Settings
      summary: Update Voice
      operationId: settingsUpdateVoice
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTTSVoice'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TTSVoice'
        '422':
          description: The request body failed validation, or the speed is out of range for the voice's provider, or that provider has no speed parameter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/voices/{voice_id}/preview:
    post:
      tags:
      - Settings
      summary: Preview Voice
      operationId: settingsPreviewVoice
      parameters:
      - name: voice_id
        in: path
        required: true
        schema:
          type: string
          title: Voice Id
      responses:
        '200':
          description: TTS audio preview
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/global-prompt/config:
    get:
      tags:
      - Settings
      summary: Get Global Prompt Config
      operationId: settingsGetGlobalPromptConfig
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalPromptConfig'
    put:
      tags:
      - Settings
      summary: Save Global Prompt Config
      operationId: settingsSaveGlobalPromptConfig
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GlobalPromptConfig'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalPromptConfig'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/global:
    get:
      tags:
      - Settings
      summary: Get Global Settings
      operationId: settingsGetGlobalSettings
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettingsData'
    put:
      tags:
      - Settings
      summary: Update Global Settings
      operationId: settingsUpdateGlobalSettings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateGlobalSettingsRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GlobalSettingsData'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/settings/effective:
    get:
      tags:
      - Settings
      summary: Get Effective Settings
      operationId: settingsGetEffectiveSettings
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  $ref: '#/components/schemas/GlobalSettings'
                propertyNames:
                  $ref: '#/components/schemas/Language'
                type: object
                title: Response Settingsgeteffectivesettings
  /v1/settings/scenario-generation/models:
    get:
      tags:
      - Settings
      summary: Get Scenario Generation Models
      operationId: settingsGetScenarioGenerationModels
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioGenerationModelsResponse'
components:
  schemas:
    AzureOpenAILLMSettings:
      properties:
        provider:
          type: string
          const: azure_openai
          title: Provider
        model:
          $ref: '#/components/schemas/AzureOpenAIModel'
      type: object
      required:
      - provider
      - model
      title: AzureOpenAILLMSettings
    HamsaTTSSpeaker:
      type: string
      enum:
      - Hiba
      - Khadija
      - Jasem
      - Fahd
      - Salma
      - Noor
      - Lana
      - Fatma
      - Mariam
      - Nada
      - Samir
      - Dalal
      - Mais
      - Alia
      - Faiza
      - Dima
      - Lyali
      - Carla
      - Hind
      - Safa
      - Somaya
      - Ali
      - Ahmed
      - Mazen
      - Majd
      - Amjad
      - Layan
      - Talin
      - Rema
      - Rami
      - Hamdan
      - Maher
      - Majid
      - Mansour
      - Hasan
      - Sayed
      title: HamsaTTSSpeaker
    GeminiLLMSettings:
      properties:
        provider:
          type: string
          const: gemini
          title: Provider
        region:
          type: string
          enum:
          - us-central1
          - me-central2
          - us-east1
          - europe-west1
          - europe-west3
          title: Region
          default: europe-west3
        model:
          type: string
          enum:
          - flash
          - pro
          - flash-lite-3.1
          title: Model
          default: flash
      type: object
      required:
      - provider
      title: GeminiLLMSettings
    CartesiaModels:
      type: string
      enum:
      - sonic-3
      - sonic-2
      - sonic
      title: CartesiaModels
    UpdateGlobalSettingsRequest:
      properties:
        data:
          additionalProperties:
            $ref: '#/components/schemas/GlobalSettings'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Data
        scenario_generation:
          $ref: '#/components/schemas/ScenarioGenerationConfig'
        max_call_duration_seconds:
          anyOf:
          - type: integer
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Max Call Duration Seconds
      type: object
      required:
      - data
      - scenario_generation
      title: UpdateGlobalSettingsRequest
    HamsaTTSSettings:
      properties:
        provider:
          type: string
          const: hamsa
          title: Provider
        speaker:
          $ref: '#/components/schemas/HamsaTTSSpeaker'
          default: Hiba
        dialect:
          $ref: '#/components/schemas/HamsaTTSDialect'
          default: ksa
      type: object
      required:
      - provider
      title: HamsaTTSSettings
    AzureOpenAIModel:
      type: string
      enum:
      - gpt-4.1
      title: AzureOpenAIModel
    SarjOmniTTSSettings:
      properties:
        provider:
          type: string
          const: sarj_omni
          title: Provider
        voice:
          type: string
          pattern: ^(?:clone:)?[A-Za-z0-9][A-Za-z0-9_-]{0,63}$
          title: Voice
          description: Built-in voice ID or clone:<profile_id>
          default: ars_male
        speed:
          type: number
          maximum: 1.2
          minimum: 0.8
          title: Speed
          description: Speech speed (0.8-1.2)
          default: 1.0
      type: object
      required:
      - provider
      title: SarjOmniTTSSettings
    ListVoicesResponse:
      properties:
        voices:
          items:
            $ref: '#/components/schemas/TTSVoice'
          type: array
          title: Voices
        cursor:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cursor
        prev_cursor:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Prev Cursor
      type: object
      required:
      - voices
      title: ListVoicesResponse
    TimeoutSettings:
      properties:
        type:
          type: string
          const: enabled
          title: Type
          default: enabled
        duration:
          anyOf:
          - type: string
            format: duration
          - type: integer
          title: Duration
          default: 15
        max_retries:
          type: integer
          title: Max Retries
          default: 5
      type: object
      title: TimeoutSettings
    ScenarioGenerationModel:
      type: string
      enum:
      - gemini-2.5-pro
      - gemini-2.5-flash
      - gemini-2.5-flash-lite
      - gemini-3.1-pro-preview
      - gemini-3.6-flash
      - gemini-3.5-flash
      - gemini-3.5-flash-lite
      title: ScenarioGenerationModel
    OpenAITTSVoices:
      type: string
      enum:
      - alloy
      - ash
      - ballad
      - coral
      - echo
      - fable
      - onyx
      - nova
      - sage
      - shimmer
      title: OpenAITTSVoices
    OpenAISTTSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        model:
          type: string
          enum:
          - gpt-4o-transcribe
          - gpt-4o-mini-transcribe
          title: Model
        region:
          type: string
          const: default
          title: Region
          default: default
      type: object
      required:
      - provider
      - model
      title: OpenAISTTSettings
    Language:
      type: string
      enum:
      - en
      - ar
      - ur
      title: Language
      description: Language codes in ISO 639-1
    GeneralScope:
      properties:
        type:
          type: string
          const: general
          title: Type
          default: general
      type: object
      title: GeneralScope
    GoogleSTTSettings:
      properties:
        provider:
          type: string
          const: google
          title: Provider
        model:
          type: string
          enum:
          - long
          - short
          - telephony
          - chirp_2
          - chirp_3
          title: Model
        region:
          type: string
          enum:
          - us
          - eu
          title: Region
      type: object
      required:
      - provider
      - model
      - region
      title: GoogleSTTSettings
    AzureTTSSettings:
      properties:
        provider:
          type: string
          const: azure
          title: Provider
        region:
          type: string
          enum:
          - eastus
          - germanywestcentral
          title: Region
          default: eastus
        voice:
          type: string
          title: Voice
          default: en-US-JennyNeural
      type: object
      required:
      - provider
      title: AzureTTSSettings
    CerebrasLLMModel:
      type: string
      enum:
      - llama-3.1-8b-instruct
      title: CerebrasLLMModel
    ListVoicesRequest:
      properties:
        cursor:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cursor
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 10
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        provider:
          anyOf:
          - type: string
          - type: 'null'
          title: Provider
        language:
          anyOf:
          - $ref: '#/components/schemas/Language'
          - type: 'null'
        gender:
          anyOf:
          - type: string
          - type: 'null'
          title: Gender
      type: object
      title: ListVoicesRequest
    GlobalSettingsData:
      properties:
        data:
          additionalProperties:
            $ref: '#/components/schemas/GlobalSettings'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Data
        last_updated:
          type: string
          title: Last Updated
        updated_by:
          type: string
          title: Updated By
        scenario_generation:
          $ref: '#/components/schemas/ScenarioGenerationConfig'
        max_call_duration_seconds:
          type: integer
          exclusiveMinimum: 0.0
          title: Max Call Duration Seconds
          default: 600
        llm_fallback:
          anyOf:
          - $ref: '#/components/schemas/LLMFallbackConfig'
          - type: 'null'
      type: object
      required:
      - data
      - last_updated
      - updated_by
      title: GlobalSettingsData
    GlobalPromptConfig:
      properties:
        updated_at:
          type: string
          title: Updated At
        updated_by:
          type: string
          title: Updated By
        available_variables:
          additionalProperties:
            $ref: '#/components/schemas/VariableInfo'
          type: object
          title: Available Variables
        sections:
          items:
            $ref: '#/components/schemas/PromptSection'
          type: array
          title: Sections
      type: object
      required:
      - updated_at
      - updated_by
      - available_variables
      - sections
      title: GlobalPromptConfig
    LiveKitTurnDetection:
      properties:
        type:
          type: string
          const: livekit_v1_mini
          title: Type
          default: livekit_v1_mini
        unlikely_threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Unlikely Threshold
        min_endpointing_delay:
          type: string
          format: duration
          title: Min Endpointing Delay
          default: PT0.3S
        max_endpointing_delay:
          type: string
          format: duration
          title: Max Endpointing Delay
          default: PT2.5S
      type: object
      title: LiveKitTurnDetection
    OpenAITTSSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        model:
          $ref: '#/components/schemas/OpenAITTSModels'
          default: gpt-4o-mini-tts
        voice:
          $ref: '#/components/schemas/OpenAITTSVoices'
          default: ash
        speed:
          type: number
          maximum: 4.0
          minimum: 0.25
          title: Speed
          description: Speech speed (0.25-4.0)
          default: 1.0
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
      type: object
      required:
      - provider
      title: OpenAITTSSettings
    SarjEouTurnDetection:
      properties:
        type:
          type: string
          const: sarj_eou
          title: Type
          default: sarj_eou
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          default: 0.5
        prediction_timeout:
          type: string
          format: duration
          title: Prediction Timeout
          default: PT0.5S
        min_endpointing_delay:
          type: string
          format: duration
          title: Min Endpointing Delay
          default: PT0.5S
        max_endpointing_delay:
          type: string
          format: duration
          title: Max Endpointing Delay
          default: PT3S
        targeted_stt_providers:
          items:
            $ref: '#/components/schemas/STTProvider'
          type: array
          title: Targeted Stt Providers
      type: object
      title: SarjEouTurnDetection
    BackChannelConfig:
      properties:
        type:
          type: string
          const: freq
          title: Type
          default: freq
        value:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Value
          default: 0.6
        whitelist:
          items:
            type: string
          type: array
          title: Whitelist
      type: object
      title: BackChannelConfig
    HamsaTTSDialect:
      type: string
      enum:
      - pls
      - egy
      - syr
      - irq
      - jor
      - leb
      - ksa
      - uae
      - bah
      - qat
      - msa
      title: HamsaTTSDialect
    SarjF5TTSVoice:
      type: string
      enum:
      - Male
      - Female
      title: SarjF5TTSVoice
    PromptSection:
      properties:
        name:
          type: string
          title: Name
        language:
          anyOf:
          - $ref: '#/components/schemas/Language'
          - type: 'null'
        content:
          type: string
          title: Content
        scope:
          anyOf:
          - $ref: '#/components/schemas/GeneralScope'
          - $ref: '#/components/schemas/TTSProviderScope'
          - $ref: '#/components/schemas/STTProviderScope'
          - $ref: '#/components/schemas/LLMProviderScope'
          - $ref: '#/components/schemas/UseCaseScope'
          title: Scope
        order:
          type: integer
          title: Order
      type: object
      required:
      - name
      - language
      - content
      - scope
      - order
      title: PromptSection
    DeepgramTTSSettings:
      properties:
        provider:
          type: string
          const: deepgram
          title: Provider
        model:
          $ref: '#/components/schemas/DeepgramTTSModel'
          default: aura-2
        voice:
          type: string
          title: Voice
      type: object
      required:
      - provider
      - voice
      title: DeepgramTTSSettings
    SpeechmaticsSTTSettings:
      properties:
        provider:
          type: string
          const: speechmatics
          title: Provider
        language:
          $ref: '#/components/schemas/Language'
          default: en
        operating_point:
          type: string
          title: Operating Point
          default: enhanced
      type: object
      required:
      - provider
      title: SpeechmaticsSTTSettings
    OrpheusArabicVoice:
      type: string
      enum:
      - fahad
      - sultan
      - lulwa
      - noura
      - aisha
      - abdullah
      title: OrpheusArabicVoice
    DisableBackChanneling:
      properties:
        type:
          type: string
          const: disable
          title: Type
          default: disable
      type: object
      title: DisableBackChanneling
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    TTSProviderScope:
      properties:
        type:
          type: string
          const: provider_specific
          title: Type
          default: provider_specific
        provider:
          type: string
          const: tts
          title: Provider
          default: tts
        model:
          $ref: '#/components/schemas/TTSProvider'
      type: object
      required:
      - model
      title: TTSProviderScope
    OrpheusEnglishVoice:
      type: string
      enum:
      - autumn
      - diana
      - hannah
      - austin
      - daniel
      - troy
      title: OrpheusEnglishVoice
    STTProviderScope:
      properties:
        type:
          type: string
          const: provider_specific
          title: Type
          default: provider_specific
        provider:
          type: string
          const: stt
          title: Provider
          default: stt
        model:
          $ref: '#/components/schemas/STTProvider'
      type: object
      required:
      - model
      title: STTProviderScope
    ElevenLabsSTTModel:
      type: string
      enum:
      - scribe_v1
      - scribe_v2
      - scribe_v2_realtime
      title: ElevenLabsSTTModel
    ScenarioGenerationConfig:
      properties:
        model:
          $ref: '#/components/schemas/ScenarioGenerationModel'
          default: gemini-2.5-pro
        temperature:
          type: number
          maximum: 2.0
          minimum: 0.0
          title: Temperature
          default: 0.7
      type: object
      title: ScenarioGenerationConfig
    SoundId:
      type: string
      enum:
      - keyboard_typing
      title: SoundId
    GroqLLMModel:
      type: string
      enum:
      - llama-3.1-405b-reasoning
      - llama-3.1-8b-instant
      - llama-3.3-70b-versatile
      - llama3-groq-70b-8192-tool-use-preview
      - llama3-groq-8b-8192-tool-use-preview
      - llama-guard-3-8b
      - llama3-70b-8192
      - llama3-8b-8192
      - mixtral-8x7b-32768
      - gemma-7b-it
      - gemma2-9b-it
      - meta-llama/llama-4-scout-17b-16e-instruct
      - meta-llama/llama-4-maverick-17b-128e-instruct
      - openai/gpt-oss-20b
      - openai/gpt-oss-120b
      - qwen/qwen3-32b
      title: GroqLLMModel
    OpenAITTSModels:
      type: string
      enum:
      - gpt-4o-mini-tts
      - tts-1
      - tts-1-hd
      title: OpenAITTSModels
    OpenAILLMSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        region:
          type: string
          const: default
          title: Region
          default: default
        model:
          $ref: '#/components/schemas/OpenAIModel'
        service_tier:
          $ref: '#/components/schemas/OpenAIServiceTier'
          default: default
      type: object
      required:
      - provider
      - model
      title: OpenAILLMSettings
    OpenAIServiceTier:
      type: string
      enum:
      - default
      - fast
      title: OpenAIServiceTier
    BackChannelWordConfig:
      properties:
        type:
          type: string
          const: word
          title: Type
          default: word
        value:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Value
          default: 0.6
        whitelist:
          items:
            type: string
          type: array
          title: Whitelist
      type: object
      title: BackChannelWordConfig
    AWSTTSSettings:
      properties:
        provider:
          type: string
          const: aws
          title: Provider
        region:
          type: string
          enum:
          - eu-central-1
          - us-east-1
          title: Region
          default: eu-central-1
      type: object
      required:
      - provider
      title: AWSTTSSettings
    BackChannelMixConfig:
      properties:
        type:
          type: string
          const: mix
          title: Type
          default: mix
        value:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Value
          default: 0.6
