      - message
      title: VerificationNeededSuggestion
      description: "Action Required: Placeholder values that need user verification.\n\nShows in \"Action Required\" section (orange, NOT dismissable).\n\nCRITICAL - WHEN TO USE:\n- ONLY for PLACEHOLDER values that YOU generated (e.g., +966500000000)\n- NEVER for values the user explicitly provided in their prompt!\n- If user said \"Transfer number is +966555555555\" → DO NOT suggest verification\n- If user said \"Working hours 10am-midnight\" → DO NOT suggest verification\n- If user mentioned a specific KB by name → DO NOT suggest verification\n\nINTEGRATION SUGGESTIONS:\n- User explicitly mentioned integration but it's NOT connected → use this type\n- Include action_label + action_url to show \"Set Up Integration\" button\n\nExample JSON:\n{\"type\": \"verification_needed\", \"section\": \"tools\", \"title\": \"Update Transfer Number\",\n \"message\": \"Replace the placeholder with your actual support hotline.\",\n \"field_name\": \"transfer_to\", \"current_value\": \"+966500000000\", \"fix_type\": \"phone\",\n \"tool_slug\": \"transfer-to-human\"}\n\nIntegration example:\n{\"type\": \"verification_needed\", \"section\": \"tools\", \"title\": \"Connect Salla Store\",\n \"message\": \"You mentioned using Salla for orders. Connect your Salla store.\",\n \"field_name\": \"salla_integration\", \"current_value\": \"not_connected\", \"fix_type\": \"link\",\n \"action_label\": \"Set Up Salla\", \"action_url\": \"/integrations\", \"tool_slug\": \"salla-tools\"}"
    ScheduleCallbackToolParameters:
      properties:
        tool_slug:
          type: string
          const: schedule-callback
          title: Tool Slug
        trigger_conditions:
          items:
            type: string
            minLength: 1
          type: array
          minItems: 1
          title: Trigger Conditions
          description: The single list of cases when a callback should be offered or recorded. The agent reads it during the call to decide whether to offer one, and the post-call analyst reads the same list to infer one when follow_up_inference is set. Callbacks, whether agreed during the call or created by the call report afterwards, can be at most max_wait ahead (the scenario's max_wait, never more than 29 days). A condition that implies a later date (for example a reminder the day before a payment due next quarter) is not supported and will be refused.
          examples:
          - - When the customer asks to be called back later
            - When the customer says now is not a good time
            - When the person who can decide is unavailable
        confirmation_messages:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Confirmation Messages
          description: 'Optional message confirming the agreed callback time, per language. Use {time} as the placeholder: it renders as the bare day and clock phrase ("3:30 PM", "tomorrow 3:30 PM"), so the template supplies the approximation word itself ("around {time}"). A bare {time} promises a minute-exact call the scheduler does not guarantee.'
          examples:
          - ar: تمام، بنتواصل معك {time} تقريباً
            en: Great, we'll call you back around {time}.
            ur: ٹھیک ہے، ہم آپ کو {time} کے قریب کال کریں گے۔
        offer_callbacks_in_call:
          type: boolean
          title: Offer Callbacks In Call
          description: Whether the agent can agree a callback time during the call. When off, the tool is never registered with the agent (the agent never offers or promises live, and the scenario prompt handles the conversation normally); a customer's explicit request is still caught by the post-call analyst and booked.
          default: true
        requires_human_support:
          type: boolean
          title: Requires Human Support
          description: Whether a human must be reachable during the callback. The AI still places the callback; enabling this constrains callback times to the transfer-to-human tool's working hours so an escalation mid-callback can succeed.
          default: false
        max_reschedule_attempts:
          type: integer
          maximum: 10.0
          exclusiveMinimum: 0.0
          title: Max Reschedule Attempts
          description: How many times a callback may be rescheduled across its lifetime (the customer answers a callback and asks to move it again). Changes of mind within one call do not count.
          default: 3
          examples:
          - 3
        min_wait:
          type: string
          format: duration
          title: Min Wait
          description: 'Shortest wait between now and a callback. Requests sooner than this are moved to now plus this wait, and the agent confirms the moved time. The same wait is re-applied after the call: a promise made early in a long call can fall under the platform''s minimum booking lead by the time the callback is booked, and the booker moves it to now plus this wait rather than dropping it.'
          default: PT15M
          examples:
          - PT15M
        max_wait:
          type: string
          format: duration
          title: Max Wait
          description: Longest wait between now and a callback. Requests beyond this are refused rather than clamped, and the agent asks for a nearer time. The ceiling sits below the platform's booking horizon, and booking time only moves closer to the promised time, so a promise at the ceiling stays inside the horizon.
          default: P29D
          examples:
          - P29D
        default_callback_hour:
          type: integer
          maximum: 23.0
          minimum: 0.0
          title: Default Callback Hour
          description: Local hour used when the analyst derives a callback time from a day-only anchor
          default: 10
          examples:
          - 10
        follow_up_inference:
          anyOf:
          - $ref: '#/components/schemas/FollowUpInference'
          - type: 'null'
          description: When set, the post-call analyst may also infer follow-up callbacks from the transcript. Leave unset to record only what the agent agreed in the call.
      additionalProperties: false
      type: object
      required:
      - tool_slug
      - trigger_conditions
      title: ScheduleCallbackToolParameters
      description: "Records a request to call the customer back later, during or after the call.\n\nWHEN TO USE: Only when the prompt mentions calling the customer back at a later time\n(customer asks for a callback, the right person is unavailable, a follow-up was\npromised). Never add it by default.\nBEST PRACTICES:\n- Define 2-4 trigger conditions in English; they are evaluation signals, not spoken text\n- Phrase confirmations as an approximate time (\"around 3:30\"): the exact dial time is\n  decided later by the scheduler, so never promise a minute-exact call\n- Use `{time}` in the confirmation messages as the placeholder for the agreed time.\n  It is substituted with the bare day and clock phrase only (\"3:30 PM\", \"tomorrow\n  3:30 PM\"), so the template itself must carry the approximation word: write\n  \"around {time}\", never a bare \"{time}\"\n- Set `requires_human_support` when the callback needs a human to be available too;\n  it requires a transfer-to-human tool with working hours configured\n- Configure `follow_up_inference` only when the business also wants callbacks the\n  customer never asked for\n- Set `default_callback_hour` to the local hour the analyst should book when the\n  call fixes only a day (\"call me tomorrow\"), not a time of day\n\nCALLING WINDOW: the callback calling window is the scenario's schedule configuration\n(the `ScheduleConfig` row behind `schedule_config_id`, resolved through\n`ScheduleConfigStore.resolve_scenario_default`). That is a single daily start/end\nwindow with a timezone that may be null, in which case the scenario's own timezone\napplies. The scenario may have no schedule configuration, a disabled one, or one with\nno retry_window: all three mean no window, and only min/max wait apply. There is no\nper-weekday map here, unlike the transfer tool's working hours (adding one is a\ntracked follow-up). The tool carries no window and no timezone of its own.\n\nNOTE: This tool only records the request; scheduling and dialing happen after the call."
    WorkingHoursDisabled:
      properties:
        enabled:
          type: boolean
          const: false
          title: Enabled
          default: false
      type: object
      title: WorkingHoursDisabled
    ResourceLinkingSuggestion:
      properties:
        section:
          $ref: '#/components/schemas/SuggestionSection'
          description: The form section this suggestion relates to
          examples:
          - tools
          - prompt
          - knowledge_bases
        title:
          type: string
          minLength: 1
          title: Title
          description: Short headline (3-6 words). REQUIRED, will be REJECTED without it!
          examples:
          - Update Transfer Number
          - Connect Salla Store
          - Add Product FAQs
        message:
          type: string
          title: Message
          description: Explanation with context (1-2 sentences)
          examples:
          - Replace the placeholder with your actual support hotline.
          - You mentioned using Salla for orders. Connect your Salla store to enable order management.
        type:
          type: string
          const: resource_linking
          title: Type
          default: resource_linking
        tool_slug:
          anyOf:
          - $ref: '#/components/schemas/ToolTypeSlug'
          - type: 'null'
          description: 'Tool identifier. Valid values: transfer-to-human, zoho-desk-create-ticket, end-call, code-switching, custom-api, salla-tools, ivr-navigation'
          examples:
          - custom-api
          - transfer-to-human
          - salla-tools
        action_label:
          anyOf:
          - type: string
          - type: 'null'
          title: Action Label
          description: Button text for external page actions. Must pair with action_url.
          examples:
          - Create Knowledge Base
          - Set Up Salla
          - Configure Webhooks
        action_url:
          anyOf:
          - $ref: '#/components/schemas/ActionUrl'
          - type: 'null'
          description: External page URL. Must pair with action_label. See ActionUrl for valid values.
          examples:
          - /knowledge-bases
          - /integrations
          - /webhooks
      type: object
      required:
      - section
      - title
      - message
      title: ResourceLinkingSuggestion
      description: "Opportunities: LLM-suggested enhancements the user did NOT ask for.\n\nShows in \"Opportunities\" section (green, dismissable).\n\nUSE WHEN external resource creation would enhance the scenario:\n- Knowledge base: \"Create a knowledge base with your product FAQs\"\n- Integration setup: \"Set up Zoho Desk integration to enable ticket creation\"\n- NOTE: Attaching KBs is done from the scenario form, not the KB page.\n\nCRITICAL DISTINCTION:\n- User explicitly mentioned integration but it's NOT connected → use verification_needed\n- LLM suggests integration as enhancement (user didn't ask) → use this type\n\nEXTERNAL vs SAME-PAGE:\n- For EXTERNAL pages: include action_label + action_url (shows button) (The only valid urls are: /knowledge-bases, /integrations, /webhooks)\n- For SAME page sections: NO action_url (clicking row scrolls to section)\n\nHTTP Tool is NOT an integration! It's added in Tools section (same page).\nOnly Salla and Zoho need `/integrations` because they require external OAuth setup.\n\nExample JSON (external page - has button):\n{\"type\": \"resource_linking\", \"section\": \"knowledge_bases\", \"title\": \"Add Product FAQs\",\n \"message\": \"Create a knowledge base with pricing info.\",\n \"action_label\": \"Create Knowledge Base\", \"action_url\": \"/knowledge-bases\"}\n\n{\"type\": \"resource_linking\", \"section\": \"tools\", \"title\": \"Set Up Salla Store\",\n \"message\": \"Connect your Salla store for real-time order status.\",\n \"action_label\": \"Set Up Salla\", \"action_url\": \"/integrations\"}\n\nExample JSON (same page - no button, clicking scrolls):\n{\"type\": \"resource_linking\", \"section\": \"tools\", \"title\": \"Connect to Your POS\",\n \"message\": \"Add an HTTP Tool in the Tools section to connect to your ordering API.\",\n \"tool_slug\": \"custom-api\"}"
    Language:
      type: string
      enum:
      - en
      - ar
      - ur
      title: Language
      description: Language codes in ISO 639-1
    IVRNavigationToolParameters:
      properties:
        tool_slug:
          type: string
          const: ivr-navigation
          title: Tool Slug
        cooldown_seconds:
          type: number
          minimum: 0.0
          title: Cooldown Seconds
          description: The minimum wait time (in seconds) required between sending distinct DTMF codes to prevent signal flooding.
          default: 1.0
          examples:
          - 1.5
      type: object
      required:
      - tool_slug
      title: IVRNavigationToolParameters
      description: 'Enables the agent to navigate Interactive Voice Response (IVR) phone menus.


        This tool allows the agent to press keys (send DTMF tones) when prompted by

        a call recipient (e.g., "Press 1 for Sales", "Enter extension number").'
    GlobalVariable:
      properties:
        source:
          type: string
          const: global_variable
          title: Source
        variable_id:
          type: string
          minLength: 1
          title: Variable Id
      type: object
      required:
      - source
      - variable_id
      title: GlobalVariable
    LanguageSettings:
      properties:
        language:
          $ref: '#/components/schemas/Language'
      type: object
      required:
      - language
      title: LanguageSettings
    CustomScenarioConfig:
      properties:
        for_language_settings:
          items:
            $ref: '#/components/schemas/ForLanguageSettings'
          type: array
          minItems: 1
          title: For Language Settings
          description: Language-specific settings including prompt and first message. MUST have at least 1 entry.
        template_schema:
          $ref: '#/components/schemas/Schema'
          description: Schema defining variables that can be passed to the scenario (e.g., customer_name)
        success_criteria:
          items:
            $ref: '#/components/schemas/SuccessCriterion'
          type: array
          title: Success Criteria
          description: List of criteria to evaluate call success. At least one should have is_primary=True.
          default: []
        tools:
          items:
            oneOf:
            - $ref: '#/components/schemas/EndCallToolParameters'
            - $ref: '#/components/schemas/TransferToHumanToolParameters'
            - $ref: '#/components/schemas/ZohoDeskCreateTicketToolParameters'
            - $ref: '#/components/schemas/CustomApiToolParameters'
            - $ref: '#/components/schemas/CodeSwitchToolParameters'
            - $ref: '#/components/schemas/SallaToolsBundleConfiguration'
            - $ref: '#/components/schemas/IVRNavigationToolParameters'
            - $ref: '#/components/schemas/VoicemailDetectionToolParameters'
            - $ref: '#/components/schemas/CollectDigitsToolParameters'
            - $ref: '#/components/schemas/ScheduleCallbackToolParameters'
            discriminator:
              propertyName: tool_slug
              mapping:
                code-switching: '#/components/schemas/CodeSwitchToolParameters'
                collect-digits: '#/components/schemas/CollectDigitsToolParameters'
                custom-api: '#/components/schemas/CustomApiToolParameters'
                end-call: '#/components/schemas/EndCallToolParameters'
                ivr-navigation: '#/components/schemas/IVRNavigationToolParameters'
                salla-tools: '#/components/schemas/SallaToolsBundleConfiguration'
                schedule-callback: '#/components/schemas/ScheduleCallbackToolParameters'
                transfer-to-human: '#/components/schemas/TransferToHumanToolParameters'
                voicemail-detection: '#/components/schemas/VoicemailDetectionToolParameters'
                zoho-desk-create-ticket: '#/components/schemas/ZohoDeskCreateTicketToolParameters'
          type: array
          title: Tools
          description: List of tools the AI can use during the call (end-call, transfer, etc.)
        data_extraction_settings:
          oneOf:
          - $ref: '#/components/schemas/DataExtractionEnabled'
          - $ref: '#/components/schemas/DataExtractionDisabled'
          title: Data Extraction Settings
          description: Configuration for extracting structured data from the call
          default:
            type: disabled
          discriminator:
            propertyName: type
            mapping:
              disabled: '#/components/schemas/DataExtractionDisabled'
              enabled: '#/components/schemas/DataExtractionEnabled'
        record_sinks:
          $ref: '#/components/schemas/RecordingSinkSettings'
          description: Destinations that receive the call record (e.g. its recording) after the call, independent of data extraction.
        knowledge_base_ids:
          items:
            type: string
          type: array
          title: Knowledge Base Ids
          description: IDs of knowledge bases to attach
        kb_retrieval_mode:
          $ref: '#/components/schemas/KbRetrievalMode'
          description: 'How attached knowledge bases reach the agent: inlined into the system prompt, or queried on demand via an LLM retrieval tool. llm_tool engages the retriever only when the knowledge base exceeds the inline prompt budget; smaller knowledge bases stay inline for latency.'
          default: inline
        tz:
          type: string
          title: Tz
          description: The timezone used by the scenario to derive the correct current time at runtime.
          default: Asia/Riyadh
        schedule_config_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Schedule Config Id
          description: The scenario's default schedule_config (retry/scheduling policy), resolved for calls that don't carry their own.
      type: object
      required:
      - for_language_settings
      - template_schema
      title: CustomScenarioConfig
      description: "Complete configuration for a voice bot scenario.\n\nThis is the FULL structure the scenario generator must produce.\nOutput ONLY raw JSON - no markdown code blocks, no explanatory text.\n\nCOMPLETE OUTPUT EXAMPLE:\n```json\n{\n  \"config\": {\n    \"data_extraction_settings\": {\n      \"type\": \"enabled\",\n      \"json_schema\": {\n        \"type\": \"object\",\n        \"title\": \"Customer Feedback\",\n        \"description\": \"Data collected from customer feedback call\",\n        \"required\": [\"satisfaction_rating\"],\n        \"properties\": {\n          \"satisfaction_rating\": {\n            \"type\": \"integer\",\n            \"title\": \"Satisfaction Rating\",\n            \"description\": \"Customer satisfaction from 1-5\",\n            \"minimum\": 1,\n            \"maximum\": 5\n          },\n          \"preferred_contact_method\": {\n            \"type\": \"string\",\n            \"title\": \"Preferred Contact Method\",\n            \"enum\": [\"phone\", \"email\", \"whatsapp\", \"sms\"]\n          }\n        }\n      },\n      \"advanced_settings\": {\"additional_sinks\": []}\n    },\n    \"for_language_settings\": [\n      {\n        \"back_channeling\": {\n          \"type\": \"word\",\n          \"value\": 0.6,\n          \"whitelist\": [\"تمام\", \"حاضر\", \"ممتاز\", \"زين\", \"نعم\"]\n        },\n        \"default\": true,\n        \"first_message\": \"السلام عليكم، معك نور من {{company_name}}. كيف حالك؟\",\n        \"language_settings\": {\"language\": \"ar\"},\n        \"prompt\": \"[Business-focused prompt with sections and hardcoded messages]\",\n        \"removed\": false,\n        \"timeout_settings\": {\"duration\": 15, \"max_retries\": 5, \"type\": \"enabled\"},\n        \"voice\": null\n      },\n      {\n        \"back_channeling\": {\n          \"type\": \"word\",\n          \"value\": 0.6,\n          \"whitelist\": [\"hmm\", \"I see\", \"mm-hmm\", \"uh-huh\"]\n        },\n        \"default\": false,\n        \"first_message\": \"Hello, this is Nour from {{company_name}}. How are you?\",\n        \"language_settings\": {\"language\": \"en\"},\n        \"prompt\": \"[English version with cultural adaptations]\",\n        \"removed\": false,\n        \"timeout_settings\": {\"duration\": 15, \"max_retries\": 5, \"type\": \"enabled\"},\n        \"voice\": null\n      }\n    ],\n    \"success_criteria\": [\n      {\n        \"is_primary\": true,\n        \"text\": \"- Collected customer feedback\\n- Confirmed satisfaction rating\\n- Offered follow-up if needed\"\n      },\n      {\n        \"is_primary\": false,\n        \"text\": \"Agent offered loyalty discount to retain customer\"\n      }\n    ],\n    \"template_schema\": {\n      \"fields\": [\n        {\"id\": \"customer_name\", \"type\": \"text\"},\n        {\"id\": \"company_name\", \"type\": \"text\"}\n      ]\n    },\n    \"tools\": [\n      {\n        \"tool_slug\": \"end-call\",\n        \"end_call_conditions\": [\n          \"When conversation objective is complete\",\n          \"When customer confirms satisfaction\"\n        ],\n        \"end_call_messages\": {\n          \"ar\": \"شكراً لوقتك. في أمان الله\",\n          \"en\": \"Thank you for your time. Have a great day!\"\n        }\n      },\n      {\n        \"tool_slug\": \"transfer-to-human\",\n        \"dtmf_triggers\": [\"*\"],\n        \"transfer_cases\": [\n          \"User explicitly requests human\",\n          \"Issue complexity exceeds capability\"\n        ],\n        \"transfer_messages\": {\n          \"ar\": \"بحوّلّك الحين لأحد المختصين\",\n          \"en\": \"I'll connect you with a specialist\"\n        },\n        \"transfer_to\": \"+966501234567\",\n        \"working_hours\": null\n      },\n    ]\n  },\n  \"suggestions\": [\n    {\n      \"type\": \"assumption_made\",\n      \"section\": \"tools\",\n      \"title\": \"Support Team Transfer\",\n      \"message\": \"Set transfer to support team (not sales)\",\n      \"tool_slug\": \"transfer-to-human\"\n    },\n    {\n      \"type\": \"verification_needed\",\n      \"section\": \"tools\",\n      \"title\": \"Update Transfer Number\",\n      \"message\": \"Update transfer phone number with your actual number\",\n      \"current_value\": \"+966501234567\",\n      \"fix_type\": \"phone\",\n      \"tool_slug\": \"transfer-to-human\"\n    },\n    {\n      \"type\": \"resource_linking\",\n      \"section\": \"knowledge_bases\",\n      \"title\": \"Add Product FAQs\",\n      \"message\": \"Create a knowledge base with your product FAQs\",\n      \"action_label\": \"Create Knowledge Base\",\n      \"action_url\": \"/knowledge-bases\"\n    }\n  ],\n  \"name\": \"Customer Feedback Collection\",\n  \"status\": \"active\"\n}\n```\n\nFIELD NOTES:\n- data_extraction_settings: Optional. Include when client needs structured data capture.\n- knowledge_base_ids: Optional. Only use IDs from available_knowledge_bases input.\n- voice: Always set to null - voice selection happens in UI.\n- tools: Core tools (end-call, transfer-to-human, code-switching) enabled by default. Integration tools require OAuth setup.\n- first_message: Use {{variable}} format for pre-existing variables.\n- success_criteria: Exactly ONE with is_primary=true (can have multiple points via \\n)."
    TransferToHumanToolParameters:
      properties:
        tool_slug:
          type: string
          const: transfer-to-human
          title: Tool Slug
        transfer_to:
          type: string
          minLength: 1
          title: Transfer To
          description: Phone number to transfer to
          examples:
          - '+966500000000'
        dtmf_triggers:
          items:
            type: string
          type: array
          title: Dtmf Triggers
          description: DTMF digits that trigger transfer (e.g., pressing 0)
          default: []
          examples:
          - - '0'
            - '#'
        transfer_cases:
          items:
            type: string
          type: array
          minItems: 1
          title: Transfer Cases
          description: List of cases when transfer should occur.
          examples:
          - - When the customer requests to speak with a human
            - When the AI cannot resolve the issue
            - When there is a complaint that needs escalation
        transfer_messages:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Transfer Messages
          description: Optional message to play to the user before transferring. Supports multiple-languages
          examples:
          - ar: بحوّلك الحين لأحد المختصين. لحظة وحدة
            en: Transferring you now. Please hold.
            ur: آپ کو ابھی منتقل کر رہا ہوں۔ براہ کرم انتظار کریں۔
        working_hours:
          oneOf:
          - $ref: '#/components/schemas/WorkingHoursEnabledV2'
          - $ref: '#/components/schemas/WorkingHoursDisabled'
          title: Working Hours
          description: Working hours configuration. Transfer only occurs within this time range when enabled.
          discriminator:
            propertyName: enabled
            mapping:
              'False': '#/components/schemas/WorkingHoursDisabled'
              'True': '#/components/schemas/WorkingHoursEnabledV2'
        outside_working_hours_messages:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Outside Working Hours Messages
          description: Optional message to play to the user when calls are attempted outside of working hours
        transfer_trunk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfer Trunk Id
          description: Specific SIP trunk ID for transfers. If unset, auto-selects from available outbound trunks.
        caller_id_passthrough:
          type: boolean
          title: Caller Id Passthrough
          description: 'When enabled, the transfer call presents the customer''s number as caller ID (inbound: the caller''s number; outbound: the dialed number), subject to carrier acceptance. Falls back to the trunk default when the number is unavailable.'
          default: false
        transfer_mode:
          $ref: '#/components/schemas/TransferMode'
          description: How the transfer leg is established. 'cold' dials the human straight into the caller's room (default). 'warm' puts the caller on hold while the AI briefs the human, then merges the calls.
          default: cold
        warm_summary_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Warm Summary Prompt
          description: Extra instructions appended to the warm-transfer briefing the AI gives the human agent before connecting. Only used when transfer_mode is 'warm'.
      type: object
      required:
      - tool_slug
      - transfer_to
      - transfer_cases
      title: TransferToHumanToolParameters
      description: 'Transfers the call to a human agent when the AI cannot handle the situation.


        WHEN TO USE: When users need human assistance for complex issues, complaints,

        or situations the AI is not equipped to handle.

        BEST PRACTICES:

        - Define 3-5 specific transfer scenarios

        - Include both customer-initiated (requests human) and agent-initiated (complex issue) cases

        - Use reassuring transfer messages

        - Configure DTMF trigger (usually "*") for instant human access

        - Set appropriate working hours if the transfer destination has limited availability'
    SuggestionType:
      type: string
      enum:
      - assumption_made
      - verification_needed
      - resource_linking
      title: SuggestionType
      description: 'Types of suggestions to help users refine generated scenarios.


        DO NOT SUGGEST (obvious or already visible):

        - Tool configurations visible in form

        - Standard defaults (back-channeling 0.6, timeout 15s)

        - "Review the generated prompt/criteria" (user will see it)

        - Language selection (user controls via UI checkboxes)

        - Voice selection (user controls in Agent section)


        SUGGESTION LIMITS:

        - Maximum 3-5 suggestions total

        - 1-2 verification_needed (critical placeholders only)

        - 1-2 assumption_made (significant business decisions only)

        - 0-2 resource_linking (genuinely valuable enhancements)


        LANGUAGE RULES:

        - NEVER use abbreviations: Write "Knowledge Base" not "KB", "Point of Sale" not "POS"

        - Use clear, user-friendly language


        MULTIPLE SUGGESTIONS:

        You can have multiple suggestions per section. Example: 2 verification_needed for "tools" is fine.'
    LinkScenarioRequest:
      properties:
        custom_scenario_id:
          type: string
          title: Custom Scenario Id
      type: object
      required:
      - custom_scenario_id
      title: LinkScenarioRequest
