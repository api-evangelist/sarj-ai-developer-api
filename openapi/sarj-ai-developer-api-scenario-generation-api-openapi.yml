    ActionUrl:
      type: string
      enum:
      - /knowledge-bases
      - /integrations
      - /webhooks
      title: ActionUrl
      description: "Valid action URLs for suggestions that link to external pages.\n\nVALID VALUES (external pages only):\n- /knowledge-bases - Create/manage knowledge bases\n- /integrations - Set up Salla, Zoho, etc.\n- /webhooks - Configure post-call webhooks\n\nNEVER use /scenarios - that's the current page!\n\nCRITICAL - HTTP Tool is NOT an integration!\nHTTP Tool is added directly in the Tools section of this page. Do NOT use action_url for it.\nOnly Salla and Zoho need `/integrations` because they require external OAuth setup.\n\nBUTTON vs CLICKABLE ROW:\n- Same-page sections (tools, prompt, etc.) → Clicking scrolls to that section. NO action_url.\n- External pages → Provide action_label + action_url to show a button.\n\nExamples:\n    - \"Connect to Your POS\" → NO action_url (HTTP Tool is in Tools section, same page)\n    - \"Set Up Salla\" → HAS action_url=\"/integrations\" (Salla requires external OAuth setup)\n    - \"Sync to CRM\" → HAS action_url=\"/webhooks\" (Webhooks is a separate page)"
    CodeSwitchToolParameters:
      properties:
        tool_slug:
          type: string
          const: code-switching
          title: Tool Slug
        switch_cases:
          items:
            type: string
          type: array
          minItems: 1
          title: Switch Cases
          description: List of cases when a language switch should occur.
          examples:
          - - When the user speaks in a different language
            - When user explicitly requests language change
        transition_phrase:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Transition Phrase
          description: Dictionary mapping target languages to transition phrases to inform the user of the language switch.
          examples:
          - ar: دعنا نكمل بالعربية.
            en: Let's continue in English.
            ur: آئیے اردو میں بات جاری رکھتے ہیں۔
      type: object
      required:
      - tool_slug
      - switch_cases
      title: CodeSwitchToolParameters
      description: 'Switches the conversation language when the user speaks a different language.


        WHEN TO USE: When the scenario needs to support multiple languages and

        gracefully switch between them based on user preference.

        BEST PRACTICES:

        - Define clear cases for when to switch languages

        - Include culturally appropriate transition phrases in each language

        - Common trigger: when user speaks in a different language'
    SuccessCriterion:
      properties:
        is_primary:
          type: boolean
          title: Is Primary
          description: Whether this is the primary success criterion. Exactly one should be True.
          default: false
        text:
          type: string
          title: Text
          description: Description of what constitutes success. Use bullet points with \n for multiple items in primary criteria.
          examples:
          - Customer confirmed their order details
          - '- Collected payment information\n- Confirmed payment date\n- Sent confirmation'
          - Agent successfully created support ticket with all required fields
      type: object
      required:
      - text
      title: SuccessCriterion
      description: "Defines a success criterion for evaluating call outcomes.\n\nSuccess criteria determine whether a call achieved its business objectives.\nThey are used for analytics and quality monitoring.\n\n- Could be tool-related: \"Agent transferred to specialist when customer requested human advisor\"\n- Could be business-related: \"Offered loyalty program benefits to retain customer\"\n\nSTRUCTURE:\n- PRIMARY (is_primary=True): Exactly ONE criterion that determines call success/failure.\n  The text field can contain multiple points separated by newlines.\n  Format: \"- Point 1\\n- Point 2\\n- Point 3\"\n    - Single point: \"Successfully collected customer feedback and confirmed satisfaction\"\n    - Multiple points: \"- Collected customer payment information\\\\n- Confirmed scheduled payment date\\\\n- Sent payment confirmation\"\n    - With tool call: \"- Collected issue details\\\\n- Created support ticket\\\\n- Confirmed ticket number\"\n  ALL points must be met for the call to be marked as successful.\n\n- SECONDARY (is_primary=False): Zero or more additional criteria.\n  Each secondary is a separate object. These are nice-to-have objectives\n  that don't affect overall call success/failure status.\n\nTOOL CALLS IN SUCCESS CRITERIA:\n- As Primary: When tool call IS the main business objective\n  Example: \"Agent successfully created support ticket with all required fields\"\n- As Secondary: When tool usage is optional/supplementary\n  Example: \"Agent transferred to specialist when loan exceeded $100K\"\n- Not in Criteria: When it's standard operation (e.g., end-call is expected behavior)\n\nCRITICAL DISTINCTION:\n- Tool CONFIGURATION (messages, conditions) → Define in \"tools\" array\n- Tool USAGE EVALUATION → Define here ONLY when it's a business objective"
    SuggestionSection:
      type: string
      enum:
      - first_message
      - prompt
      - template_variables
      - data_extraction
      - language
      - knowledge_bases
      - agent
      - success_criteria
      - tools
      title: SuggestionSection
      description: 'Form sections that a suggestion can relate to.


        IMPORTANT: Use the EXACT string values below - no variations!


        - `first_message` - First message/greeting configuration

        - `prompt` - Agent prompt/instructions

        - `template_variables` - Input data given to the agent (NOT "template_variable")

        - `data_extraction` - Data extraction settings

        - `language` - Language configuration

        - `knowledge_bases` - Knowledge base attachments (NOT "knowledge_base")

        - `agent` - Agent Profile selection

        - `success_criteria` - Success criteria configuration

        - `tools` - Tools configurations (NOT "tool")'
    VoicemailDetectionToolParameters:
      properties:
        tool_slug:
          type: string
          const: voicemail-detection
          title: Tool Slug
        hangup_when_voicemail_detected:
          type: boolean
          title: Hangup When Voicemail Detected
          default: true
        message_before_hangup:
          anyOf:
          - $ref: '#/components/schemas/LLMInstruction'
          - additionalProperties:
              anyOf:
              - type: string
              - type: 'null'
            propertyNames:
              $ref: '#/components/schemas/Language'
            type: object
          - type: 'null'
          title: Message Before Hangup
      type: object
      required:
      - tool_slug
      title: VoicemailDetectionToolParameters
      description: 'Detects when the call has reached a voicemail or answering machine and responds appropriately.


        WHEN TO USE: Include in outbound call scenarios where the agent may reach voicemail.

        BEST PRACTICES:

        - Set hangup_when_voicemail_detected to true to end the call immediately on detection

        - Use message_before_hangup with a MultiLingualMessage for a fixed recorded message

        - Use message_before_hangup with an LLMInstruction to let the agent generate the message'
    ZohoDeskCreateTicketToolParameters:
