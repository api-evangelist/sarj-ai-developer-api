openapi: 3.2.0
info:
  title: Sarj.ai Voice Scenario Generation API
  version: 1.0.0
tags:
- name: scenario-generation
paths:
  /v1/beta/generation-logs/metadata:
    get:
      tags:
      - scenario-generation
      summary: Get Suggestion Metadata
      operationId: scenarioGenerationGetSuggestionMetadata
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuggestionMetadataResponse'
  /v1/beta/generation-logs:
    post:
      tags:
      - scenario-generation
      summary: Generate Scenario
      operationId: scenarioGenerationGenerateScenario
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GenerateScenarioRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerateScenarioResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/generation-logs/{log_id}:
    get:
      tags:
      - scenario-generation
      summary: Get Generation Log
      operationId: scenarioGenerationGetGenerationLog
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Generation Log ID
          title: Log Id
        description: Generation Log ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioGenerationLog'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - scenario-generation
      summary: Link Scenario
      operationId: scenarioGenerationLinkScenario
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Generation Log ID
          title: Log Id
        description: Generation Log ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LinkScenarioRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScenarioGenerationLog'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/generation-logs/{log_id}/status:
    get:
      tags:
      - scenario-generation
      summary: Get Generation Status
      operationId: scenarioGenerationGetGenerationStatus
      parameters:
      - name: log_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Generation Log ID
          title: Log Id
        description: Generation Log ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/generation-logs/by-scenario/{scenario_id}:
    get:
      tags:
      - scenario-generation
      summary: Get By Scenario Id
      operationId: scenarioGenerationGetByScenarioId
      parameters:
      - name: scenario_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          description: Custom Scenario ID
          title: Scenario Id
        description: Custom Scenario ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ScenarioGenerationLog'
                - type: 'null'
                title: Response Scenariogenerationgetbyscenarioid
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    WeekDay:
      type: integer
      enum:
      - 0
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      title: WeekDay
    KbRetrievalMode:
      type: string
      enum:
      - inline
      - llm_tool
      title: KbRetrievalMode
    SuggestionMetadataResponse:
      properties:
        fix_types:
          items:
            $ref: '#/components/schemas/FixType'
          type: array
          title: Fix Types
        inline_editable_fix_types:
          items:
            $ref: '#/components/schemas/FixType'
          type: array
          title: Inline Editable Fix Types
        section_labels:
          additionalProperties:
            type: string
          propertyNames:
            $ref: '#/components/schemas/SuggestionSection'
          type: object
          title: Section Labels
        section_tab_map:
          additionalProperties:
            $ref: '#/components/schemas/ScenarioTab'
          propertyNames:
            $ref: '#/components/schemas/SuggestionSection'
          type: object
          title: Section Tab Map
        suggestion_sections:
          items:
            $ref: '#/components/schemas/SuggestionSection'
          type: array
          title: Suggestion Sections
        suggestion_types:
          items:
            $ref: '#/components/schemas/SuggestionType'
          type: array
          title: Suggestion Types
      type: object
      required:
      - fix_types
      - inline_editable_fix_types
      - section_labels
      - section_tab_map
      - suggestion_sections
      - suggestion_types
      title: SuggestionMetadataResponse
    ToolTypeSlug:
      type: string
      enum:
      - code-switching
      - collect-digits
      - transfer-to-human
      - end-call
      - zoho-desk-create-ticket
      - custom-api
      - salla-tools
      - ivr-navigation
      - voicemail-detection
      - schedule-callback
      title: ToolTypeSlug
    GenerationSuccessOutput:
      properties:
        status:
          type: string
          const: success
          title: Status
          default: success
        config:
          $ref: '#/components/schemas/CustomScenarioConfig'
        suggestions:
          items:
            oneOf:
            - $ref: '#/components/schemas/VerificationNeededSuggestion'
            - $ref: '#/components/schemas/AssumptionMadeSuggestion'
            - $ref: '#/components/schemas/ResourceLinkingSuggestion'
            discriminator:
              propertyName: type
              mapping:
                assumption_made: '#/components/schemas/AssumptionMadeSuggestion'
                resource_linking: '#/components/schemas/ResourceLinkingSuggestion'
                verification_needed: '#/components/schemas/VerificationNeededSuggestion'
          type: array
          title: Suggestions
        scenario_name:
          type: string
          title: Scenario Name
        model:
          type: string
          title: Model
        generation_time_ms:
          type: integer
          title: Generation Time Ms
      type: object
      required:
      - config
      - scenario_name
      - model
      - generation_time_ms
      title: GenerationSuccessOutput
    AgentProvidedVariable_Literal__string___:
      properties:
        source:
          type: string
          const: agent_provided
          title: Source
        description:
          type: string
          title: Description
        type:
          type: string
          const: string
          title: Type
        required:
          type: boolean
          title: Required
        allowed_values:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Values
      type: object
      required:
      - source
      - description
      - type
      - required
      title: AgentProvidedVariable[Literal['string']]
    FixedValue_list_object__:
      properties:
        source:
          type: string
          const: fixed
          title: Source
        value:
          items: {}
          type: array
          title: Value
        is_encrypted:
          type: boolean
          title: Is Encrypted
          default: false
      type: object
      required:
      - source
      - value
      title: FixedValue[list[object]]
    TimeRangeDayConfiguration:
      properties:
        start_time:
          type: string
          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
          title: Start Time
          description: Start time in HH:MM format (24-hour)
        end_time:
          type: string
          pattern: ^([01]\d|2[0-3]):([0-5]\d)$
          title: End Time
          description: End time in HH:MM format (24-hour)
      type: object
      required:
      - start_time
      - end_time
      title: TimeRangeDayConfiguration
    ScheduleConfiguration:
      properties:
        timezone:
          type: string
          title: Timezone
          description: IANA timezone (e.g., 'America/New_York')
        schedule:
          additionalProperties:
            $ref: '#/components/schemas/TimeRangeDayConfiguration'
          propertyNames:
            $ref: '#/components/schemas/WeekDay'
          type: object
          title: Schedule
      type: object
      required:
      - timezone
      - schedule
      title: ScheduleConfiguration
    FixedValue_Union_int__float__:
      properties:
        source:
          type: string
          const: fixed
          title: Source
        value:
          anyOf:
          - type: integer
          - type: number
          title: Value
        is_encrypted:
          type: boolean
          title: Is Encrypted
          default: false
      type: object
      required:
      - source
      - value
      title: FixedValue[Union[int, float]]
    AgentProvidedVariable_Literal__array___:
      properties:
        source:
          type: string
          const: agent_provided
          title: Source
        description:
          type: string
          title: Description
        type:
          type: string
          const: array
          title: Type
        required:
          type: boolean
          title: Required
        allowed_values:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Allowed Values
      type: object
      required:
      - source
      - description
      - type
      - required
      title: AgentProvidedVariable[Literal['array']]
    SallaToolsBundleConfiguration:
      properties:
        tool_slug:
          type: string
          const: salla-tools
          title: Tool Slug
        functionalities_enabled_map:
          additionalProperties:
            type: boolean
          propertyNames:
            $ref: '#/components/schemas/SallaCustomerFacingFunctionality'
          type: object
          title: Functionalities Enabled Map
          description: 'Important: all functionalities must be mapped to a True/False value. Missing parameters are ambiguous and could cause errors.'
          examples:
          - browse-logistics: true
            browse-products: true
            read-previous-orders: true
      type: object
      required:
      - tool_slug
      - functionalities_enabled_map
      title: SallaToolsBundleConfiguration
      description: 'Enables Salla e-commerce platform integration for the voice agent.


        NOTE: Requires a functional Salla integration configured for the organization.'
    CollectDigitsToolParameters:
      properties:
        tool_slug:
          type: string
          const: collect-digits
          title: Tool Slug
        field_name:
          type: string
          pattern: ^[a-z][a-z0-9_]{0,63}$
          title: Field Name
          examples:
          - national_id
          - phone_number
        field_description:
          type: string
          maxLength: 300
          title: Field Description
          examples:
          - Saudi National ID or Iqama (10 digits)
        num_digits:
          anyOf:
          - type: integer
            maximum: 32.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Num Digits
          examples:
          - 10
        min_digits:
          anyOf:
          - type: integer
            maximum: 32.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Min Digits
          examples:
          - 3
        max_digits:
          anyOf:
          - type: integer
            maximum: 32.0
            exclusiveMinimum: 0.0
          - type: 'null'
          title: Max Digits
          examples:
          - 8
        ask_for_confirmation:
          type: boolean
          title: Ask For Confirmation
          default: true
        dtmf_input_timeout:
          type: number
          maximum: 60.0
          exclusiveMinimum: 0.0
          title: Dtmf Input Timeout
          default: 6.0
          examples:
          - 6.0
        dtmf_stop_event:
          type: string
          enum:
          - '*'
          - '#'
          - A
          - B
          - C
          - D
          title: Dtmf Stop Event
          default: '*'
          examples:
          - '*'
        extra_instructions:
          type: string
          maxLength: 1000
          title: Extra Instructions
          default: ''
      type: object
      required:
      - tool_slug
      - field_name
      - field_description
      title: CollectDigitsToolParameters
      description: "Collects digits from the caller via DTMF keypad and/or spoken digit sequences.\n\nWHEN TO USE: National ID / Iqama, phone numbers, OTP codes, account numbers—any numeric capture\nwhere keypad input reduces recognition errors versus free-form transcription.\n\nTwo length modes, mutually exclusive:\n- Fixed: `num_digits` set — capture exactly that many digits (IDs, fixed OTPs).\n- Variable: `num_digits` unset — capture until the stop key, `max_digits`, or an\n  inter-digit pause once at least `min_digits` arrived (amounts, order numbers)."
    GenerationErrorOutput:
      properties:
        status:
          type: string
          const: error
          title: Status
          default: error
        error:
          type: string
          title: Error
        error_code:
          $ref: '#/components/schemas/GenerationErrorCode'
        generation_time_ms:
          type: integer
          title: Generation Time Ms
      type: object
      required:
      - error
      - error_code
      - generation_time_ms
      title: GenerationErrorOutput
    WorkingHoursEnabledV2:
      properties:
        enabled:
          type: boolean
          const: true
          title: Enabled
          default: true
        schedule_configuration:
          $ref: '#/components/schemas/ScheduleConfiguration'
      type: object
      required:
      - schedule_configuration
      title: WorkingHoursEnabledV2
    ScenarioOptionalField:
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 1
          title: Id
        source:
          type: string
          const: scenario
          title: Source
          default: scenario
        type:
          type: string
          enum:
          - text
          - number
          - boolean
          title: Type
        required:
          type: boolean
          const: false
          title: Required
          default: false
        default:
          anyOf:
          - {}
          - type: 'null'
          title: Default
      type: object
      required:
      - id
      - type
      title: ScenarioOptionalField
    GenerationErrorCode:
      type: string
      enum:
      - JSON_PARSE_ERROR
      - VALIDATION_FAILED
      - PROMPT_INJECTION
      - INVALID_INPUT
      - MAX_RETRIES_EXCEEDED
      - GENERATION_FAILED
      title: GenerationErrorCode
    ForLanguageSettings:
      properties:
        default:
          type: boolean
          title: Default
          description: Whether this is the default language. Exactly one should be True.
          default: false
        language_settings:
          $ref: '#/components/schemas/LanguageSettings'
          description: Language configuration including the language code (ar, en)
        first_message:
          type: string
          title: First Message
          description: Opening message the AI says when call starts.
          examples:
          - مرحباً {{customer_name}}، معك نور. كيف أقدر أساعدك؟
        disable_first_message:
          type: boolean
          title: Disable First Message
          description: Prevents the agent from uttering the first message.
          default: false
        prompt:
          type: string
          title: Prompt
          description: Full system prompt for the AI. Should include role, objectives, and instructions.
        agent_profile_id:
          type: string
          title: Agent Profile Id
          description: ID of the agent profile to use for voice and behavior settings
          default: ''
      type: object
      required:
      - language_settings
      - first_message
      - prompt
      title: ForLanguageSettings
      description: 'Language-specific configuration for the scenario.


        Each scenario must have at least one language setting. The prompt and first_message

        should be in the specified language with proper tashkeel for Arabic.'
    ScenarioTab:
      type: string
      enum:
      - scenario
      - configuration
      title: ScenarioTab
    FixedValue_str_:
      properties:
        source:
          type: string
          const: fixed
          title: Source
        value:
          type: string
          title: Value
        is_encrypted:
          type: boolean
          title: Is Encrypted
          default: false
      type: object
      required:
      - source
      - value
      title: FixedValue[str]
    ZohoCRMRecordSink:
      properties:
        type:
          type: string
          const: zoho_crm_update_record
          title: Type
          default: zoho_crm_update_record
      type: object
      title: ZohoCRMRecordSink
    Schema:
      properties:
        fields:
          items:
            anyOf:
            - $ref: '#/components/schemas/GlobalVariableField'
            - $ref: '#/components/schemas/ScenarioRequiredField'
            - $ref: '#/components/schemas/ScenarioOptionalField'
          type: array
          title: Fields
      type: object
      required:
      - fields
      title: Schema
    KeyValueVariable:
      properties:
        key:
          type: string
          minLength: 1
          title: Key
        value:
          oneOf:
          - $ref: '#/components/schemas/StringVariable'
          - $ref: '#/components/schemas/NumberVariable'
          - $ref: '#/components/schemas/BooleanVariable'
          - $ref: '#/components/schemas/ArrayVariable'
          title: Value
          discriminator:
            propertyName: type
            mapping:
              array: '#/components/schemas/ArrayVariable'
              boolean: '#/components/schemas/BooleanVariable'
              number: '#/components/schemas/NumberVariable'
              string: '#/components/schemas/StringVariable'
      type: object
      required:
      - key
      - value
      title: KeyValueVariable
    PayloadConfiguration:
      properties:
        template:
          type: string
          title: Template
        variables:
          additionalProperties:
            oneOf:
            - $ref: '#/components/schemas/StringVariable'
            - $ref: '#/components/schemas/NumberVariable'
            - $ref: '#/components/schemas/BooleanVariable'
            - $ref: '#/components/schemas/ArrayVariable'
            discriminator:
              propertyName: type
              mapping:
                array: '#/components/schemas/ArrayVariable'
                boolean: '#/components/schemas/BooleanVariable'
                number: '#/components/schemas/NumberVariable'
                string: '#/components/schemas/StringVariable'
          type: object
          title: Variables
      type: object
      required:
      - template
      - variables
      title: PayloadConfiguration
    FixType:
      type: string
      enum:
      - phone
      - text
      - time_range
      - boolean
      - link
      title: FixType
      description: 'Types of fix actions for verification_needed suggestions.


        - phone, text: Support inline editing in sidebar

        - time_range, boolean, link: Click to scroll to actual field (complex inputs)'
    ScenarioVariable:
      properties:
        source:
          type: string
          const: scenario_variable
          title: Source
        variable_id:
          type: string
          minLength: 1
          title: Variable Id
      type: object
      required:
      - source
      - variable_id
      title: ScenarioVariable
    ConnectionSettings:
      properties:
        timeout:
          type: integer
          maximum: 300.0
          minimum: 1.0
          title: Timeout
        retry_count:
          type: integer
          maximum: 10.0
          minimum: 0.0
          title: Retry Count
      type: object
      required:
      - timeout
      - retry_count
      title: ConnectionSettings
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    StringVariable:
      properties:
        type:
          type: string
          const: string
          title: Type
        name:
          type: string
          minLength: 1
          title: Name
        config:
          anyOf:
          - $ref: '#/components/schemas/FixedValue_str_'
          - $ref: '#/components/schemas/ScenarioVariable'
          - $ref: '#/components/schemas/GlobalVariable'
          - $ref: '#/components/schemas/AgentProvidedVariable_Literal__string___'
          title: Config
      type: object
      required:
      - type
      - name
      - config
      title: StringVariable
    GenerationStatusResponse:
      properties:
        generation_log:
          $ref: '#/components/schemas/ScenarioGenerationLog'
        has_running_task:
          type: boolean
          title: Has Running Task
      type: object
      required:
      - generation_log
      - has_running_task
      title: GenerationStatusResponse
    NumberVariable:
      properties:
        type:
          type: string
          const: number
          title: Type
        name:
          type: string
          minLength: 1
          title: Name
        config:
          anyOf:
          - $ref: '#/components/schemas/FixedValue_Union_int__float__'
          - $ref: '#/components/schemas/ScenarioVariable'
          - $ref: '#/components/schemas/AgentProvidedVariable_Literal__number___'
          title: Config
      type: object
      required:
      - type
      - name
      - config
      title: NumberVariable
    SallaCustomerFacingFunctionality:
      type: string
      enum:
      - browse-products
      - browse-logistics
      - create-update-order
      - read-previous-orders
      title: SallaCustomerFacingFunctionality
      description: Enum for functionalities exposed via the integration APIs. Simplifies UI/UX and bundles required tools under a single functionality.
    ArrayVariable:
      properties:
        type:
          type: string
          const: array
          title: Type
        name:
          type: string
          minLength: 1
          title: Name
        config:
          anyOf:
          - $ref: '#/components/schemas/FixedValue_list_object__'
          - $ref: '#/components/schemas/ScenarioVariable'
          - $ref: '#/components/schemas/AgentProvidedVariable_Literal__array___'
          title: Config
        array_item_type:
          type: string
          enum:
          - string
          - number
          - boolean
          title: Array Item Type
      type: object
      required:
      - type
      - name
      - config
      - array_item_type
      title: ArrayVariable
    ScenarioRequiredField:
      properties:
        id:
          type: string
          maxLength: 100
          minLength: 1
          title: Id
        source:
          type: string
          const: scenario
          title: Source
          default: scenario
        type:
          type: string
          enum:
          - text
          - number
          - boolean
          title: Type
        required:
          type: boolean
          const: true
          title: Required
          default: true
      type: object
      required:
      - id
      - type
      title: ScenarioRequiredField
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    GenerateScenarioRequest:
      properties:
        prompt:
          type: string
          maxLength: 10000
          minLength: 50
          title: Prompt
        languages:
          items:
            $ref: '#/components/schemas/Language'
          type: array
          minItems: 1
          title: Languages
          description: List of languages to generate the scenario for (e.g., ['ar', 'en'])
      type: object
      required:
      - prompt
      title: GenerateScenarioRequest
    DataExtractionDisabled:
      properties:
        type:
          type: string
          const: disabled
          title: Type
          default: disabled
      type: object
      title: DataExtractionDisabled
    AssumptionMadeSuggestion:
      properties:
        section:
          $ref: '#/components/schemas/SuggestionSection'
          description: The form section this suggestion relates to
          examples:
          - tools
          - prompt
          - knowledge_bases
        title:
          type: string
          minLength: 1
          title: Title
          description: Short headline (3-6 words). REQUIRED, will be REJECTED without it!
          examples:
          - Update Transfer Number
          - Connect Salla Store
          - Add Product FAQs
        message:
          type: string
          title: Message
          description: Explanation with context (1-2 sentences)
          examples:
          - Replace the placeholder with your actual support hotline.
          - You mentioned using Salla for orders. Connect your Salla store to enable order management.
        type:
          type: string
          const: assumption_made
          title: Type
          default: assumption_made
        tool_slug:
          anyOf:
          - $ref: '#/components/schemas/ToolTypeSlug'
          - type: 'null'
          description: 'Tool identifier. Valid values: transfer-to-human, zoho-desk-create-ticket, end-call, code-switching, custom-api, salla-tools, ivr-navigation'
          examples:
          - transfer-to-human
          - zoho-desk-create-ticket
          - end-call
      type: object
      required:
      - section
      - title
      - message
      title: AssumptionMadeSuggestion
      description: "AI Decisions: Inform user about assumptions the LLM made.\n\nShows in \"AI Decisions\" section (purple, dismissable).\n\nUSE WHEN LLM filled in details not explicitly stated in the user's prompt:\n- Business type/purpose inferred: \"Assumed this scenario is for billing inquiries\"\n- Team/department for transfers: \"Set transfer to support team (not sales)\"\n- Business logic decisions: \"Configured ticket priority based on customer sentiment\"\n\nSOURCE ATTRIBUTION:\n- If derived from user's URL, include \"(from [domain])\" in message.\n- Otherwise, no source attribution needed.\n\nInclude all assumption details in the message field.\n\nExample JSON:\n{\"type\": \"assumption_made\", \"section\": \"tools\", \"title\": \"Using Zoho Desk\",\n \"message\": \"Configured ticket creation with Zoho Desk based on your requirements.\",\n \"tool_slug\": \"zoho-desk-create-ticket\"}\n\n{\"type\": \"assumption_made\", \"section\": \"prompt\", \"title\": \"Technical Support Role\",\n \"message\": \"Agent configured for technical issue resolution based on your description.\"}"
    DataExtractionEnabled:
      properties:
        type:
          type: string
          const: enabled
          title: Type
          default: enabled
        json_schema:
          additionalProperties: true
          type: object
          title: Json Schema
          description: JSON Schema defining what data to extract. Must be a valid JSON Schema with type, properties, and required fields.
          examples:
          - description: Data collected from customer feedback call
            properties:
              satisfaction_rating:
                description: Customer satisfaction from 1-5
                maximum: 5
                minimum: 1
                title: Satisfaction Rating
                type: integer
              preferred_contact_method:
                description: How customer prefers follow-up
                enum:
                - phone
                - email
                - whatsapp
                - sms
                title: Preferred Contact Method
                type: string
            required:
            - satisfaction_rating
            title: Customer Feedback
            type: object
        advanced_settings:
          $ref: '#/components/schemas/AdvancedDataExtractionSettings'
          description: Optional advanced settings for data sinks
      type: object
      required:
      - json_schema
      title: DataExtractionEnabled
      description: 'Captures structured data from conversations for analytics and business intelligence.


        WHEN TO USE:

        - Client needs specific data points extracted from calls

        - Business requires analytics on conversation outcomes

        - Data needs to be stored in structured format for CRM/reporting systems


        HOW TO CONFIGURE:

        1. Define the JSON schema with clear property names

        2. Specify data types: boolean, string, number, or enum (for multiple choice)

        3. Add descriptive titles and descriptions for each field

        4. Mark required fields - only fields critical for business value

        5. Use enum for predefined options (e.g., contact methods, categories)


        COMMON USE CASES:

        - E-commerce: Discount acceptance, preferred contact method, product feedback

        - Healthcare: Symptom severity, appointment preferences, satisfaction ratings

        - Banking: Transaction types, complaint categories, resolution preferences

        - Customer Service: Issue type, urgency level, satisfaction score

        - Sales: Lead quality, interest level, budget range, decision timeframe


        NOTE: Only include data extraction when the client needs structured data

        capture. Not all scenarios require this feature.'
