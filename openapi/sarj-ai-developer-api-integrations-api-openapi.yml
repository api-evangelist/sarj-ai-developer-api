    IntegrationProvider:
      type: string
      enum:
      - zoho
      - rasayel
      - salla
      - salesforce
      title: IntegrationProvider
      description: "Available integration providers.\n\n`salla-tools` and `zoho-desk-create-ticket` require\
        \ external OAuth setup and are\nNEVER auto-generated in the output tool config, connected or not\
        \ - suggest them\ninstead (see `Suggestion Categorization for Integration Tools` below).\n\n**Suggestion\
        \ Categorization for Integration Tools:**\n\n   **Use `verification_needed`** (shows in \"Action\
        \ Required\" section):\n   - When user EXPLICITLY mentions needing Salla/Zoho in their business\
        \ requirements\n   - Example: User says \"We use Salla for orders\" but Salla not in active integrations\n\
        \   - This is a REQUIREMENT the user stated - they need to set it up\n\n   **Use `resource_linking`**\
        \ (shows in \"Opportunities\" section):\n   - When LLM SUGGESTS an integration that could enhance\
        \ the scenario\n   - User did NOT ask for this; LLM thinks it would be helpful\n   - Example:\
        \ For a restaurant scenario, LLM suggests Salla could help with order tracking\n\n**Examples:**\n\
        \nUser prompt: \"We need Salla for order management\"\nActive integrations: None connected\n→\
        \ DO NOT add a salla-tools entry to the tool config\n→ ADD `verification_needed` suggestion: \"\
        Connect Salla Store\" with action_url=\"/integrations\"\n\nUser prompt: \"Restaurant delivery\
        \ agent\" (no mention of Salla/Zoho)\nActive integrations: zoho\n→ DO NOT add a zoho-desk-create-ticket\
        \ entry to the tool config\n→ Can suggest salla as `resource_linking` (optional enhancement)"
