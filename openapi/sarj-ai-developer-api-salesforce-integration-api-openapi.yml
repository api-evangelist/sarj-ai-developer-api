openapi: 3.2.0
info:
  title: Sarj.ai Voice Salesforce Integration API
  version: 1.0.0
tags:
- name: salesforce-integration
paths:
  /v1/beta/integrations/salesforce/authorize:
    get:
      tags:
      - salesforce-integration
      summary: Authorize
      description: 'Return the Salesforce authorization URL for the front-end to redirect to.


        Called server-side by the authenticated front-end so the signed

        ``state`` can be bound to the caller''s organization.


        Returns:

        The authorization URL for the front-end to redirect the user to.'
      operationId: salesforceIntegrationAuthorize
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesforceAuthorizationUrl'
  /v1/beta/integrations/salesforce/callback:
    get:
      tags:
      - salesforce-integration
      summary: Salesforce Callback
      description: 'Salesforce redirects the browser here, then we bounce back to the app.


        On denied consent Salesforce redirects with ``error`` and no ``code``,

        so both are optional and the error path is handled explicitly.


        Returns:

        A redirect back to the app with the success or error outcome.'
      operationId: salesforceIntegrationSalesforceCallback
      parameters:
      - name: state
        in: query
        required: true
        schema:
          type: string
          title: State
      - name: code
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Code
      - name: error
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error
      - name: error_description
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Description
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    SalesforceAuthorizationUrl:
      properties:
        authorization_url:
          type: string
          title: Authorization Url
      type: object
      required:
      - authorization_url
      title: SalesforceAuthorizationUrl
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
