openapi: 3.2.0
info:
  title: Sarj STT Openai API
  description: Production Arabic speech recognition API serving the single `sarj-stt` model through OpenAI-
    and AWS-compatible interfaces.
  version: 1.0.2
tags:
- name: Openai
paths:
  /openai/v1/audio/transcriptions:
    post:
      summary: Groq Transcriptions Endpoint
      description: 'Transcribes an audio file. This endpoint is now a thin wrapper that

        calls the business logic in the ASR model.'
      operationId: groq_transcriptions_endpoint_openai_v1_audio_transcriptions_post
      parameters:
      - name: accept
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Used to detect SSE stream requests.
          title: Accept
        description: Used to detect SSE stream requests.
      - name: x-session-id
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Optional session id to persist restaurant mode.
          title: X-Session-Id
        description: Optional session id to persist restaurant mode.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_groq_transcriptions_endpoint_openai_v1_audio_transcriptions_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - BearerAuth: []
      tags:
      - Openai
components:
  schemas:
    TranscriptionLanguage:
      type: string
      enum:
      - ar
      title: TranscriptionLanguage
    Body_groq_transcriptions_endpoint_openai_v1_audio_transcriptions_post:
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          title: File
          description: The audio file to transcribe.
        model:
          type: string
          enum:
          - sarj-stt
          title: Model
          description: Sarj STT model identifier. This API serves only `sarj-stt`.
          default: sarj-stt
        stream:
          type: boolean
          title: Stream
          default: false
        response_format:
          $ref: '#/components/schemas/TranscriptionResponseFormat'
          default: json
        language:
          $ref: '#/components/schemas/TranscriptionLanguage'
          default: ar
      type: object
      required:
      - file
      title: Body_groq_transcriptions_endpoint_openai_v1_audio_transcriptions_post
    TranscriptionResponseFormat:
      type: string
      enum:
      - json
      - text
      - verbose_json
      title: TranscriptionResponseFormat
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
