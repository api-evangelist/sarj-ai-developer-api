openapi: 3.2.0
info:
  title: Sarj.ai Voice Sip Provisioning API
  version: 1.0.0
tags:
- name: sip-provisioning
paths:
  /v1/beta/sip-connections/{sip_connection_id}/provision:
    post:
      tags:
      - sip-provisioning
      summary: Provision
      operationId: sipProvisioningProvision
      parameters:
      - name: sip_connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sip Connection Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProvisionSipConnectionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SipVerificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/sip-connections/{sip_connection_id}/verify:
    post:
      tags:
      - sip-provisioning
      summary: Verify
      operationId: sipProvisioningVerify
      parameters:
      - name: sip_connection_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Sip Connection Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SipVerificationResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/sip-connections/endpoint-check:
    post:
      tags:
      - sip-provisioning
      summary: Check Endpoint
      operationId: sipProvisioningCheckEndpoint
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EndpointCheckInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndpointCheckResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ProvisionSipConnectionRequest:
      properties:
        spec:
          anyOf:
          - oneOf:
            - $ref: '#/components/schemas/IpEndpointSpec'
            - $ref: '#/components/schemas/DigestEndpointSpec'
            discriminator:
              propertyName: auth_kind
              mapping:
                digest: '#/components/schemas/DigestEndpointSpec'
                ip: '#/components/schemas/IpEndpointSpec'
          - type: 'null'
          title: Spec
      additionalProperties: false
      type: object
      title: ProvisionSipConnectionRequest
    SipVerificationResponse:
      properties:
        status:
          $ref: '#/components/schemas/SipConnectionStatus'
        checks:
          items:
            $ref: '#/components/schemas/VerificationCheck'
          type: array
          title: Checks
      additionalProperties: false
      type: object
      required:
      - status
      - checks
      title: SipVerificationResponse
    DispatcherDestination:
      properties:
        uri:
          type: string
          title: Uri
        flags:
          type: integer
          minimum: 0.0
          title: Flags
          default: 0
        priority:
          type: integer
          minimum: 0.0
          title: Priority
          default: 0
        attrs:
          type: string
          title: Attrs
          default: ''
      additionalProperties: false
      type: object
      required:
      - uri
      title: DispatcherDestination
    SipConnectionStatus:
      type: string
      enum:
      - pending_verification
      - active
      - disabled
      title: SipConnectionStatus
    DigestEndpointSpec:
      properties:
        auth_kind:
          type: string
          const: digest
          title: Auth Kind
          default: digest
        outbound_destination:
          anyOf:
          - $ref: '#/components/schemas/DispatcherDestination'
          - type: 'null'
        digest_credentials:
          $ref: '#/components/schemas/DigestCredentials'
      additionalProperties: false
      type: object
      required:
      - digest_credentials
      title: DigestEndpointSpec
    InboundSignalingAddress:
      properties:
        ip:
          type: string
          title: Ip
        mask:
          type: integer
          maximum: 128.0
          minimum: 0.0
          title: Mask
          default: 32
        port:
          type: integer
          maximum: 65535.0
          minimum: 0.0
          title: Port
          default: 0
        tag:
          type: string
          title: Tag
          default: ''
      additionalProperties: false
      type: object
      required:
      - ip
      title: InboundSignalingAddress
    DigestCredentials:
      properties:
        username:
          type: string
          title: Username
        password:
          type: string
          format: password
          title: Password
          writeOnly: true
      additionalProperties: false
      type: object
      required:
      - username
      - password
      title: DigestCredentials
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    ProviderType:
      type: string
      enum:
      - carrier
      - client_endpoint
      title: ProviderType
    VerificationCheckStatus:
      type: string
      enum:
      - passed
      - pending
      title: VerificationCheckStatus
    VerificationCheckName:
      type: string
      enum:
      - dispatcher_destinations_active
      - inbound_addresses_whitelisted
      - digest_registration
      title: VerificationCheckName
    IpEndpointSpec:
      properties:
        auth_kind:
          type: string
          const: ip
          title: Auth Kind
          default: ip
        outbound_destination:
          anyOf:
          - $ref: '#/components/schemas/DispatcherDestination'
          - type: 'null'
        inbound_addresses:
          items:
            $ref: '#/components/schemas/InboundSignalingAddress'
          type: array
          title: Inbound Addresses
      additionalProperties: false
      type: object
      title: IpEndpointSpec
    ExistingClaim:
      properties:
        connection_id:
          type: string
          title: Connection Id
        provider_id:
          type: string
          title: Provider Id
        provider_name:
          type: string
          title: Provider Name
        provider_type:
          $ref: '#/components/schemas/ProviderType'
      additionalProperties: false
      type: object
      required:
      - connection_id
      - provider_id
      - provider_name
      - provider_type
      title: ExistingClaim
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    EndpointCheckInput:
      properties:
        auth_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Auth Username
        signaling_addresses:
          items:
            $ref: '#/components/schemas/InboundSignalingAddress'
          type: array
          title: Signaling Addresses
      additionalProperties: false
      type: object
      title: EndpointCheckInput
    UsernameAvailability:
      type: string
      enum:
      - taken
      - platform_free
      title: UsernameAvailability
    EndpointCheckResult:
      properties:
        existing_claim:
          anyOf:
          - $ref: '#/components/schemas/ExistingClaim'
          - type: 'null'
        platform_signaling_addresses:
          items:
            type: string
          type: array
          title: Platform Signaling Addresses
        username_availability:
          $ref: '#/components/schemas/UsernameAvailability'
      additionalProperties: false
      type: object
      required:
      - existing_claim
      - platform_signaling_addresses
      - username_availability
      title: EndpointCheckResult
    VerificationCheck:
      properties:
        name:
          $ref: '#/components/schemas/VerificationCheckName'
        status:
          $ref: '#/components/schemas/VerificationCheckStatus'
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
      additionalProperties: false
      type: object
      required:
      - name
      - status
      title: VerificationCheck
