    TransferToHumanToolParameters:
      properties:
        tool_slug:
          type: string
          const: transfer-to-human
          title: Tool Slug
        transfer_to:
          type: string
          minLength: 1
          title: Transfer To
          description: Phone number to transfer to
          examples:
          - '+966500000000'
        dtmf_triggers:
          items:
            type: string
          type: array
          title: Dtmf Triggers
          description: DTMF digits that trigger transfer (e.g., pressing 0)
          default: []
          examples:
          - - '0'
            - '#'
        transfer_cases:
          items:
            type: string
          type: array
          minItems: 1
          title: Transfer Cases
          description: List of cases when transfer should occur.
          examples:
          - - When the customer requests to speak with a human
            - When the AI cannot resolve the issue
            - When there is a complaint that needs escalation
        transfer_messages:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Transfer Messages
          description: Optional message to play to the user before transferring. Supports multiple-languages
          examples:
          - ar: بحوّلك الحين لأحد المختصين. لحظة وحدة
            en: Transferring you now. Please hold.
            ur: آپ کو ابھی منتقل کر رہا ہوں۔ براہ کرم انتظار کریں۔
        working_hours:
          oneOf:
          - $ref: '#/components/schemas/WorkingHoursEnabledV2'
          - $ref: '#/components/schemas/WorkingHoursDisabled'
          title: Working Hours
          description: Working hours configuration. Transfer only occurs within this time range when enabled.
          discriminator:
            propertyName: enabled
            mapping:
              'False': '#/components/schemas/WorkingHoursDisabled'
              'True': '#/components/schemas/WorkingHoursEnabledV2'
        outside_working_hours_messages:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Outside Working Hours Messages
          description: Optional message to play to the user when calls are attempted outside of working hours
        transfer_trunk_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Transfer Trunk Id
          description: Specific SIP trunk ID for transfers. If unset, auto-selects from available outbound trunks.
        caller_id_passthrough:
          type: boolean
          title: Caller Id Passthrough
          description: 'When enabled, the transfer call presents the customer''s number as caller ID (inbound: the caller''s number; outbound: the dialed number), subject to carrier acceptance. Falls back to the trunk default when the number is unavailable.'
          default: false
        transfer_mode:
          $ref: '#/components/schemas/TransferMode'
          description: How the transfer leg is established. 'cold' dials the human straight into the caller's room (default). 'warm' puts the caller on hold while the AI briefs the human, then merges the calls.
          default: cold
        warm_summary_prompt:
          anyOf:
          - type: string
          - type: 'null'
          title: Warm Summary Prompt
          description: Extra instructions appended to the warm-transfer briefing the AI gives the human agent before connecting. Only used when transfer_mode is 'warm'.
      type: object
      required:
      - tool_slug
      - transfer_to
      - transfer_cases
      title: TransferToHumanToolParameters
      description: 'Transfers the call to a human agent when the AI cannot handle the situation.


        WHEN TO USE: When users need human assistance for complex issues, complaints,

        or situations the AI is not equipped to handle.

        BEST PRACTICES:

        - Define 3-5 specific transfer scenarios

        - Include both customer-initiated (requests human) and agent-initiated (complex issue) cases

        - Use reassuring transfer messages

        - Configure DTMF trigger (usually "*") for instant human access

        - Set appropriate working hours if the transfer destination has limited availability'
    FollowUpInference:
      properties:
        default_delay:
          type: string
          format: duration
          title: Default Delay
          description: How far after the call an inferred follow-up is scheduled when the transcript names no time. Must lie within the tool's min_wait..max_wait bounds.
          default: P1D
          examples:
          - P1D
        confidence_threshold:
          type: number
          maximum: 1.0
          minimum: 0.5
          title: Confidence Threshold
          description: Minimum analyst confidence required before an inferred follow-up is recorded. Uncalibrated pilot knob.
          default: 0.8
          examples:
          - 0.8
      additionalProperties: false
      type: object
      title: FollowUpInference
      description: "Lets the post-call analyst propose a callback the agent never explicitly booked.\n\nWHEN TO USE: When the business wants follow-ups on calls where the customer did not\nask for one out loud (unresolved issue, promised update, missed decision maker).\nBEST PRACTICES:\n- The conditions live on the tool's `trigger_conditions`: one list, read by the agent\n  during the call and by the analyst after it. There is no separate inference list\n- Keep the threshold high enough that ambiguous calls are dropped rather than dialed\n- Leave this unset when only explicit customer requests should produce a callback"
