    CodeSwitchToolParameters:
      properties:
        tool_slug:
          type: string
          const: code-switching
          title: Tool Slug
        switch_cases:
          items:
            type: string
          type: array
          minItems: 1
          title: Switch Cases
          description: List of cases when a language switch should occur.
          examples:
          - - When the user speaks in a different language
            - When user explicitly requests language change
        transition_phrase:
          additionalProperties:
            anyOf:
            - type: string
            - type: 'null'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Transition Phrase
          description: Dictionary mapping target languages to transition phrases to inform the user of the language switch.
          examples:
          - ar: دعنا نكمل بالعربية.
            en: Let's continue in English.
            ur: آئیے اردو میں بات جاری رکھتے ہیں۔
      type: object
      required:
      - tool_slug
      - switch_cases
      title: CodeSwitchToolParameters
      description: 'Switches the conversation language when the user speaks a different language.


        WHEN TO USE: When the scenario needs to support multiple languages and

        gracefully switch between them based on user preference.

        BEST PRACTICES:

        - Define clear cases for when to switch languages

        - Include culturally appropriate transition phrases in each language

        - Common trigger: when user speaks in a different language'
