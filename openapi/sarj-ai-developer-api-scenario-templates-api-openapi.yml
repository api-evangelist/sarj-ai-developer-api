        WHEN TO USE: Every scenario MUST include this tool to define how calls end.

        BEST PRACTICES:

        - Define 2-4 clear end call conditions covering success and edge cases

        - Use culturally appropriate closing messages with proper tashkeel

        - Include a condition for when the user explicitly wants to end the call'
