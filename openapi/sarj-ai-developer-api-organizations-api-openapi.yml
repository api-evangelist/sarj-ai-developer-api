openapi: 3.2.0
info:
  title: Sarj.ai Voice Organizations API
  version: 1.0.0
tags:
- name: Organizations
paths:
  /v1/beta/organizations/create-for-user:
    post:
      tags:
      - Organizations
      summary: Create Organization For User
      operationId: organizationsCreateOrganizationForUser
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganization'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/onboarding-scenario:
    get:
      tags:
      - Organizations
      summary: Get Onboarding Scenario Id
      operationId: organizationsGetOnboardingScenarioId
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnboardingScenarioResponse'
  /v1/beta/organizations/:
    get:
      tags:
      - Organizations
      summary: Get Organizations
      operationId: organizationsGetOrganizations
      parameters:
      - name: settings
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/SettingsFilter'
          - type: 'null'
          title: Settings
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Organization'
                title: Response Organizationsgetorganizations
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/{organization_id}:
    get:
      tags:
      - Organizations
      summary: Get Organization
      operationId: organizationsGetOrganization
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: The ID of the organization to get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/{organization_id}/users:
    get:
      tags:
      - Organizations
      summary: List Organization Users
      operationId: organizationsListOrganizationUsers
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
                title: Response Organizationslistorganizationusers
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/users/no-organization:
    get:
      tags:
      - Organizations
      summary: List Users With No Organization
      operationId: organizationsListUsersWithNoOrganization
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/User'
                type: array
                title: Response Organizationslistuserswithnoorganization
  /v1/beta/organizations/upsert:
    post:
      tags:
      - Organizations
      summary: Upsert Organization
      operationId: organizationsUpsertOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertOrganization'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/remove-user-from-organization:
    post:
      tags:
      - Organizations
      summary: Remove User From Organization
      operationId: organizationsRemoveUserFromOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveUserOrganization'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/{organization_id}/settings:
    get:
      tags:
      - Organizations
      summary: Get Organization Settings
      operationId: organizationsGetOrganizationSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Organizations
      summary: Update Organization Settings
      operationId: organizationsUpdateOrganizationSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationSettingsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationSettings'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Delete Organization Settings
      operationId: organizationsDeleteOrganizationSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/organizations/{organization_id}/batch-settings:
    get:
      tags:
      - Organizations
      summary: Get Organization Batch Settings
      operationId: organizationsGetOrganizationBatchSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBatchSettingsResponse'
        '404':
          description: No batch settings default found for this organization
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - Organizations
      summary: Update Organization Batch Settings
      operationId: organizationsUpdateOrganizationBatchSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrganizationBatchSettingsRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationBatchSettingsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - Organizations
      summary: Delete Organization Batch Settings
      operationId: organizationsDeleteOrganizationBatchSettings
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          title: Organization Id
      responses:
        '204':
          description: Successful Response
        '404':
          description: No batch settings default found for this organization
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/outbound/assign:
    post:
      tags:
      - Organizations
      summary: Assign Outbound Trunk
      operationId: organizationSipAssignOutboundTrunk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignTrunkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrunkWithUsage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/outbound/all:
    get:
      tags:
      - Organizations
      summary: List All Outbound Trunks
      operationId: organizationSipListAllOutboundTrunks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TrunkWithUsage'
                type: array
                title: Response Organizationsiplistalloutboundtrunks
  /v1/sip/organizations/outbound/default:
    get:
      tags:
      - Organizations
      summary: Get Default Outbound Trunks
      operationId: organizationSipGetDefaultOutboundTrunks
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/TrunkWithUsage'
                type: array
                title: Response Organizationsipgetdefaultoutboundtrunks
    post:
      tags:
      - Organizations
      summary: Set Default Outbound Trunk
      operationId: organizationSipSetDefaultOutboundTrunk
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetDefaultTrunkRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrunkWithUsage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/outbound/default/{trunk_id}:
    delete:
      tags:
      - Organizations
      summary: Delete Default Outbound Trunk
      operationId: organizationSipDeleteDefaultOutboundTrunk
      parameters:
      - name: trunk_id
        in: path
        required: true
        schema:
          type: string
          title: Trunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/outbound/{organization_id}/{trunk_id}:
    delete:
      tags:
      - Organizations
      summary: Unassign Outbound Trunk
      operationId: organizationSipUnassignOutboundTrunk
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      - name: trunk_id
        in: path
        required: true
        schema:
          type: string
          title: Trunk Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/outbound/{organization_id}:
    get:
      tags:
      - Organizations
      summary: Get Available Outbound Trunks
      operationId: organizationSipGetAvailableOutboundTrunks
      parameters:
      - name: organization_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TrunkWithUsage'
                title: Response Organizationsipgetavailableoutboundtrunks
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/sip/organizations/trunk/{trunk_id}:
    get:
      tags:
      - Organizations
      summary: List Organizations For Trunk
      operationId: organizationSipListOrganizationsForTrunk
      parameters:
      - name: trunk_id
        in: path
        required: true
        schema:
          type: string
          title: Trunk Id
      - name: direction
        in: query
        required: true
        schema:
          $ref: '#/components/schemas/SIPTrunkDirection'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                title: Response Organizationsiplistorganizationsfortrunk
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    TrunkWithUsage:
      properties:
        sip_trunk_id:
          type: string
          title: Sip Trunk Id
        name:
          type: string
          title: Name
        address:
          type: string
          title: Address
        numbers:
          items:
            type: string
          type: array
          title: Numbers
        auth_username:
          anyOf:
          - type: string
          - type: 'null'
          title: Auth Username
        direction:
          $ref: '#/components/schemas/SIPTrunkDirection'
        usage:
          $ref: '#/components/schemas/TrunkUsage'
        created_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Created At
        provider:
          type: string
          title: Provider
          readOnly: true
      type: object
      required:
      - sip_trunk_id
      - name
      - address
      - numbers
      - direction
      - usage
      - provider
      title: TrunkWithUsage
    SetDefaultTrunkRequest:
      properties:
        sip_trunk_id:
          type: string
          title: Sip Trunk Id
      type: object
      required:
      - sip_trunk_id
      title: SetDefaultTrunkRequest
    GroqSTTSettings:
      properties:
        provider:
          type: string
          const: groq
          title: Provider
        model:
          $ref: '#/components/schemas/GroqSTTModels'
      type: object
      required:
      - provider
      - model
      title: GroqSTTSettings
    UserRole:
      type: string
      enum:
      - user
      - admin
      - superadmin
      title: UserRole
    User:
      properties:
        id:
          type: string
          title: Id
        organization_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
        email:
          type: string
          title: Email
        role:
          $ref: '#/components/schemas/UserRole'
      type: object
      required:
      - id
      - email
      - role
      title: User
    OrpheusArabicVoice:
      type: string
      enum:
      - fahad
      - sultan
      - lulwa
      - noura
      - aisha
      - abdullah
      title: OrpheusArabicVoice
    ElevenLabsSTTSettings:
      properties:
        provider:
          type: string
          const: elevenlabs
          title: Provider
        model:
          $ref: '#/components/schemas/ElevenLabsSTTModel'
          default: scribe_v1
        region:
          $ref: '#/components/schemas/ElevenLabsRegion'
          default: eu
      type: object
      required:
      - provider
      title: ElevenLabsSTTSettings
    GlobalSettings:
      properties:
        models:
          $ref: '#/components/schemas/GlobalModelConfig'
        back_channel:
          anyOf:
          - $ref: '#/components/schemas/BackChannelConfig'
          - $ref: '#/components/schemas/BackChannelWordConfig'
          - $ref: '#/components/schemas/BackChannelSoundConfig'
          - $ref: '#/components/schemas/BackChannelMixConfig'
          - $ref: '#/components/schemas/DisableBackChanneling'
          title: Back Channel
        allow_interruptions:
          type: boolean
          title: Allow Interruptions
        timeout:
          anyOf:
          - $ref: '#/components/schemas/TimeoutSettings'
          - $ref: '#/components/schemas/DisableTimeoutSettings'
          title: Timeout
        agent_name:
          type: string
          title: Agent Name
          default: ''
        turn_detection:
          anyOf:
          - $ref: '#/components/schemas/DisableTurnDetection'
          - $ref: '#/components/schemas/SarjEouTurnDetection'
          - $ref: '#/components/schemas/LiveKitTurnDetection'
          title: Turn Detection
        max_duration_end_call_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Max Duration End Call Message
      type: object
      required:
      - models
      - back_channel
      - allow_interruptions
      - timeout
      title: GlobalSettings
    AWSSTTSettings:
      properties:
        provider:
          type: string
          const: aws
          title: Provider
        region:
          type: string
          enum:
          - eu-central-1
          - us-east-1
          title: Region
          default: eu-central-1
      type: object
      required:
      - provider
      title: AWSSTTSettings
    StoredBatchCallDefaults:
      properties:
        calling_window:
          $ref: '#/components/schemas/TimeWindow'
        display_time_zone:
          type: string
          title: Display Time Zone
        retry_settings:
          anyOf:
          - $ref: '#/components/schemas/RetrySettings'
          - type: 'null'
      type: object
      required:
      - calling_window
      - display_time_zone
      title: StoredBatchCallDefaults
      description: 'Read-side shape of the persisted `settings_data` JSONB.


        Deliberately lenient, for the same reason `DeprecatedBatchSettings`

        (batch_call_store) is: a row written under an older contract must stay

        readable. Reading through the write-time contract instead would make a

        stale row raise inside psycopg''s row factory, so `get()` 500s rather than

        404s — and both callers only swallow 404, so the Create Batch page and the

        admin page go down together for that org. The "Reset to platform defaults"

        button that would clear the row lives on the page that just failed to

        render, so the org cannot unlock itself.


        Every write goes through `OrganizationBatchCallDefaults` below, so a row

        only lands out of contract when the contract itself tightens.'
    OpenAITTSModels:
      type: string
      enum:
      - gpt-4o-mini-tts
      - tts-1
      - tts-1-hd
      title: OpenAITTSModels
    GlobalModelConfig:
      properties:
        stt:
          anyOf:
          - $ref: '#/components/schemas/GoogleSTTSettings'
          - $ref: '#/components/schemas/AzureSTTSettings'
          - $ref: '#/components/schemas/AWSSTTSettings'
          - $ref: '#/components/schemas/GroqSTTSettings'
          - $ref: '#/components/schemas/OpenAISTTSettings'
          - $ref: '#/components/schemas/ElevenLabsSTTSettings'
          - $ref: '#/components/schemas/SpeechmaticsSTTSettings'
          - $ref: '#/components/schemas/HamsaSTTSettings'
          - $ref: '#/components/schemas/SarjGroqSTTSettings'
          - $ref: '#/components/schemas/SarjCustomSTTSettings'
          - $ref: '#/components/schemas/DeepgramSTTSettings'
          title: Stt
        stt_fallback:
          anyOf:
          - $ref: '#/components/schemas/DisableSTTFallback'
          - $ref: '#/components/schemas/STTFallbackConfig'
          title: Stt Fallback
        tts:
          anyOf:
          - $ref: '#/components/schemas/ElevenLabsTTSSettings'
          - $ref: '#/components/schemas/AzureTTSSettings'
          - $ref: '#/components/schemas/OpenAITTSSettings'
          - $ref: '#/components/schemas/AWSTTSSettings'
          - $ref: '#/components/schemas/GroqTTSSettings'
          - $ref: '#/components/schemas/HamsaTTSSettings'
          - $ref: '#/components/schemas/CartesiaTTSSettings'
          - $ref: '#/components/schemas/DeepgramTTSSettings'
          - $ref: '#/components/schemas/SarjF5TTSSettings'
          - $ref: '#/components/schemas/SarjOmniTTSSettings'
          title: Tts
        llm:
          anyOf:
          - $ref: '#/components/schemas/OpenAILLMSettings'
          - $ref: '#/components/schemas/GeminiLLMSettings'
          - $ref: '#/components/schemas/GroqLLMSettings'
          - $ref: '#/components/schemas/AzureOpenAILLMSettings'
          - $ref: '#/components/schemas/CerebrasLLMSettings'
          title: Llm
        voice_details:
          $ref: '#/components/schemas/TTSVoice'
        voice_id:
          type: string
          title: Voice Id
      type: object
      required:
      - stt
      - tts
      - llm
      - voice_details
      - voice_id
      title: GlobalModelConfig
    OpenAITTSSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        model:
          $ref: '#/components/schemas/OpenAITTSModels'
          default: gpt-4o-mini-tts
        voice:
          $ref: '#/components/schemas/OpenAITTSVoices'
          default: ash
        speed:
          type: number
          maximum: 4.0
          minimum: 0.25
          title: Speed
          description: Speech speed (0.25-4.0)
          default: 1.0
        instructions:
          anyOf:
          - type: string
          - type: 'null'
          title: Instructions
      type: object
      required:
      - provider
      title: OpenAITTSSettings
    RemoveUserOrganization:
      properties:
        user_id:
          type: string
          title: User Id
      type: object
      required:
      - user_id
      title: RemoveUserOrganization
    OrganizationBatchCallDefaults:
      properties:
        calling_window:
          $ref: '#/components/schemas/TimeWindow'
        display_time_zone:
          type: string
          title: Display Time Zone
        retry_settings:
          anyOf:
          - $ref: '#/components/schemas/RetrySettings'
          - type: 'null'
      additionalProperties: false
      type: object
      required:
      - calling_window
      - display_time_zone
      title: OrganizationBatchCallDefaults
      description: 'Write-side contract: what an admin is allowed to store as the default.


        Subclasses the stored shape so a value that passes here is always readable

        back, never the reverse.'
    LiveKitTurnDetection:
      properties:
        type:
          type: string
          const: livekit_v1_mini
          title: Type
          default: livekit_v1_mini
        unlikely_threshold:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Unlikely Threshold
        min_endpointing_delay:
          type: string
          format: duration
          title: Min Endpointing Delay
          default: PT0.3S
        max_endpointing_delay:
          type: string
          format: duration
          title: Max Endpointing Delay
          default: PT2.5S
      type: object
      title: LiveKitTurnDetection
    OpenAIModel:
      type: string
      enum:
      - gpt-5.5
      - gpt-5.4
      - gpt-5.4-mini
      - gpt-5.4-nano
      - gpt-5.2
      - gpt-5.1
      - gpt-5
      - gpt-5-mini
      - gpt-5-nano
      - gpt-4.1
      - gpt-4.1-nano
      - gpt-4o
      - gpt-4o-mini
      - o3
      - o3-mini
      - o4-mini
      title: OpenAIModel
    OrpheusEnglishVoice:
      type: string
      enum:
      - autumn
      - diana
      - hannah
      - austin
      - daniel
      - troy
      title: OrpheusEnglishVoice
    ElevenLabsSTTModel:
      type: string
      enum:
      - scribe_v1
      - scribe_v2
      - scribe_v2_realtime
      title: ElevenLabsSTTModel
    DisableTurnDetection:
      properties:
        type:
          type: string
          const: disable
          title: Type
          default: disable
      type: object
      title: DisableTurnDetection
    Language:
      type: string
      enum:
      - en
      - ar
      - ur
      title: Language
      description: Language codes in ISO 639-1
    GroqLLMModel:
      type: string
      enum:
      - llama-3.1-405b-reasoning
      - llama-3.1-8b-instant
      - llama-3.3-70b-versatile
      - llama3-groq-70b-8192-tool-use-preview
      - llama3-groq-8b-8192-tool-use-preview
      - llama-guard-3-8b
      - llama3-70b-8192
      - llama3-8b-8192
      - mixtral-8x7b-32768
      - gemma-7b-it
      - gemma2-9b-it
      - meta-llama/llama-4-scout-17b-16e-instruct
