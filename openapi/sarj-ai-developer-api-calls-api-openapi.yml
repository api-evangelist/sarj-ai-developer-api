  /v1/beta/calls/scheduled:
    get:
      tags:
      - Calls
      summary: List Scheduled Calls
      operationId: callsListScheduledCalls
      parameters:
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - scheduled
              - cancelled
              - expired
              type: string
          - type: 'null'
          title: Status
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/CallSource'
          - type: 'null'
          title: Source
      - name: scheduled_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduled From
      - name: scheduled_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Scheduled To
      - name: cursor_scheduled_at
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Cursor Scheduled At
      - name: cursor_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Cursor Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: organization_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListScheduledCallsResponse'
        '422':
