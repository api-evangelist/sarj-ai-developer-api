                title: Response Callscreatechat
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/calls/client:
    post:
      tags:
      - Calls
      summary: Create Client Call
      operationId: callsCreateClientCall
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClientCallInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClientCallResponse'
        '400':
          description: The outbound call could not be created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '403':
          description: The destination number is blocked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '404':
          description: The schedule config was not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '429':
          description: The per-phone call limit was exceeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorDetail'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/beta/calls/list:
    post:
      tags:
      - Calls
      summary: List Calls
      operationId: callsListCalls
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ListCallsInput'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
