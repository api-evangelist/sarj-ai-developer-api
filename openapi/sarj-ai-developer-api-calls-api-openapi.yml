                zoho-desk-create-ticket: '#/components/schemas/ZohoDeskCreateTicketToolParameters'
          type: array
          title: Tools
          description: List of tools the AI can use during the call (end-call, transfer, etc.)
        data_extraction_settings:
          oneOf:
          - $ref: '#/components/schemas/DataExtractionEnabled'
          - $ref: '#/components/schemas/DataExtractionDisabled'
          title: Data Extraction Settings
          description: Configuration for extracting structured data from the call
          default:
            type: disabled
          discriminator:
            propertyName: type
            mapping:
              disabled: '#/components/schemas/DataExtractionDisabled'
              enabled: '#/components/schemas/DataExtractionEnabled'
        record_sinks:
          $ref: '#/components/schemas/RecordingSinkSettings'
          description: Destinations that receive the call record (e.g. its recording) after the call, independent of data extraction.
        knowledge_base_ids:
          items:
            type: string
          type: array
          title: Knowledge Base Ids
          description: IDs of knowledge bases to attach
        kb_retrieval_mode:
          $ref: '#/components/schemas/KbRetrievalMode'
          description: 'How attached knowledge bases reach the agent: inlined into the system prompt, or queried on demand via an LLM retrieval tool. llm_tool engages the retriever only when the knowledge base exceeds the inline prompt budget; smaller knowledge bases stay inline for latency.'
          default: inline
        tz:
          type: string
          title: Tz
          description: The timezone used by the scenario to derive the correct current time at runtime.
          default: Asia/Riyadh
      type: object
      required:
      - for_language_settings
      - template_schema
      title: CustomScenarioConfig
      description: "Complete configuration for a voice bot scenario.\n\nThis is the FULL structure the scenario generator must produce.\nOutput ONLY raw JSON - no markdown code blocks, no explanatory text.\n\nCOMPLETE OUTPUT EXAMPLE:\n```json\n{\n  \"config\": {\n    \"data_extraction_settings\": {\n      \"type\": \"enabled\",\n      \"json_schema\": {\n        \"type\": \"object\",\n        \"title\": \"Customer Feedback\",\n        \"description\": \"Data collected from customer feedback call\",\n        \"required\": [\"satisfaction_rating\"],\n        \"properties\": {\n          \"satisfaction_rating\": {\n            \"type\": \"integer\",\n            \"title\": \"Satisfaction Rating\",\n            \"description\": \"Customer satisfaction from 1-5\",\n            \"minimum\": 1,\n            \"maximum\": 5\n          },\n          \"preferred_contact_method\": {\n            \"type\": \"string\",\n            \"title\": \"Preferred Contact Method\",\n            \"enum\": [\"phone\", \"email\", \"whatsapp\", \"sms\"]\n          }\n        }\n      },\n      \"advanced_settings\": {\"additional_sinks\": []}\n    },\n    \"for_language_settings\": [\n      {\n        \"back_channeling\": {\n          \"type\": \"word\",\n          \"value\": 0.6,\n          \"whitelist\": [\"تمام\", \"حاضر\", \"ممتاز\", \"زين\", \"نعم\"]\n        },\n        \"default\": true,\n        \"first_message\": \"السلام عليكم، معك نور من {{company_name}}. كيف حالك؟\",\n        \"language_settings\": {\"language\": \"ar\"},\n        \"prompt\": \"[Business-focused prompt with sections and hardcoded messages]\",\n        \"removed\": false,\n        \"timeout_settings\": {\"duration\": 15, \"max_retries\": 5, \"type\": \"enabled\"},\n        \"voice\": null\n      },\n      {\n        \"back_channeling\": {\n          \"type\": \"word\",\n          \"value\": 0.6,\n          \"whitelist\": [\"hmm\", \"I see\", \"mm-hmm\", \"uh-huh\"]\n        },\n        \"default\": false,\n        \"first_message\": \"Hello, this is Nour from {{company_name}}. How are you?\",\n        \"language_settings\": {\"language\": \"en\"},\n        \"prompt\": \"[English version with cultural adaptations]\",\n        \"removed\": false,\n        \"timeout_settings\": {\"duration\": 15, \"max_retries\": 5, \"type\": \"enabled\"},\n        \"voice\": null\n      }\n    ],\n    \"success_criteria\": [\n      {\n        \"is_primary\": true,\n        \"text\": \"- Collected customer feedback\\n- Confirmed satisfaction rating\\n- Offered follow-up if needed\"\n      },\n      {\n        \"is_primary\": false,\n        \"text\": \"Agent offered loyalty discount to retain customer\"\n      }\n    ],\n    \"template_schema\": {\n      \"fields\": [\n        {\"id\": \"customer_name\", \"type\": \"text\"},\n        {\"id\": \"company_name\", \"type\": \"text\"}\n      ]\n    },\n    \"tools\": [\n      {\n        \"tool_slug\": \"end-call\",\n        \"end_call_conditions\": [\n          \"When conversation objective is complete\",\n          \"When customer confirms satisfaction\"\n        ],\n        \"end_call_messages\": {\n          \"ar\": \"شكراً لوقتك. في أمان الله\",\n          \"en\": \"Thank you for your time. Have a great day!\"\n        }\n      },\n      {\n        \"tool_slug\": \"transfer-to-human\",\n        \"dtmf_triggers\": [\"*\"],\n        \"transfer_cases\": [\n          \"User explicitly requests human\",\n          \"Issue complexity exceeds capability\"\n        ],\n        \"transfer_messages\": {\n          \"ar\": \"بحوّلّك الحين لأحد المختصين\",\n          \"en\": \"I'll connect you with a specialist\"\n        },\n        \"transfer_to\": \"+966501234567\",\n        \"working_hours\": null\n      },\n    ]\n  },\n  \"suggestions\": [\n    {\n      \"type\": \"assumption_made\",\n      \"section\": \"tools\",\n      \"title\": \"Support Team Transfer\",\n      \"message\": \"Set transfer to support team (not sales)\",\n      \"tool_slug\": \"transfer-to-human\"\n    },\n    {\n      \"type\": \"verification_needed\",\n      \"section\": \"tools\",\n      \"title\": \"Update Transfer Number\",\n      \"message\": \"Update transfer phone number with your actual number\",\n      \"current_value\": \"+966501234567\",\n      \"fix_type\": \"phone\",\n      \"tool_slug\": \"transfer-to-human\"\n    },\n    {\n      \"type\": \"resource_linking\",\n      \"section\": \"knowledge_bases\",\n      \"title\": \"Add Product FAQs\",\n      \"message\": \"Create a knowledge base with your product FAQs\",\n      \"action_label\": \"Create Knowledge Base\",\n      \"action_url\": \"/knowledge-bases\"\n    }\n  ],\n  \"name\": \"Customer Feedback Collection\",\n  \"status\": \"active\"\n}\n```\n\nFIELD NOTES:\n- data_extraction_settings: Optional. Include when client needs structured data capture.\n- knowledge_base_ids: Optional. Only use IDs from available_knowledge_bases input.\n- voice: Always set to null - voice selection happens in UI.\n- tools: Core tools (end-call, transfer-to-human, code-switching) enabled by default. Integration tools require OAuth setup.\n- first_message: Use {{variable}} format for pre-existing variables.\n- success_criteria: Exactly ONE with is_primary=true (can have multiple points via \\n)."
