openapi: 3.2.0
info:
  title: Sarj.ai Voice Task Management API
  version: 1.0.0
tags:
- name: task-management
paths:
  /v1/task-management/:
    post:
      tags:
      - task-management
      summary: Create Task
      operationId: taskManagementCreateTask
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/task-management/{task_id}:
    get:
      tags:
      - task-management
      summary: Get Task
      operationId: taskManagementGetTask
      parameters:
      - name: task_id
        in: path
        required: true
        schema:
          type: string
          description: Task ID
          title: Task Id
        description: Task ID
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/task-management/list:
    post:
      tags:
      - task-management
      summary: List Tasks
      operationId: taskManagementListTasks
      parameters:
      - name: organization_id
        in: query
        required: true
        schema:
          type: string
          description: Organization ID
          title: Organization Id
        description: Organization ID
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Pagination cursor
          title: Cursor
        description: Pagination cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPagination'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/task-management/list-by-call/{call_id}:
    post:
      tags:
      - task-management
      summary: List Tasks By Call
      operationId: taskManagementListTasksByCall
      parameters:
      - name: call_id
        in: path
        required: true
        schema:
          type: string
          title: Call Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Pagination cursor
          title: Cursor
        description: Pagination cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPagination'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /v1/task-management/list-by-batch/{batch_id}:
    post:
      tags:
      - task-management
      summary: List Tasks By Batch
      operationId: taskManagementListTasksByBatch
      parameters:
      - name: batch_id
        in: path
        required: true
        schema:
          type: string
          title: Batch Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          description: Pagination cursor
          title: Cursor
        description: Pagination cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskPagination'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    OpenAITTSModels:
      type: string
      enum:
      - gpt-4o-mini-tts
      - tts-1
      - tts-1-hd
      title: OpenAITTSModels
    CreateTaskRequest:
      properties:
        organization_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        message:
          oneOf:
          - $ref: '#/components/schemas/EnhancedTranscriptionMessage'
          - $ref: '#/components/schemas/CallOutcomeMessage'
          - $ref: '#/components/schemas/ScenarioInsightAnalysisMessage'
          - $ref: '#/components/schemas/BatchReportGenerationMessage'
          - $ref: '#/components/schemas/CreateBatchCallsMessage'
          - $ref: '#/components/schemas/BatchCallsRetryMessage'
          - $ref: '#/components/schemas/StartBatchCallsTickMessage'
          - $ref: '#/components/schemas/DeleteOldTasksTickMessage'
          - $ref: '#/components/schemas/OutboundDispatchTickMessage'
          - $ref: '#/components/schemas/DeleteExpiredOrgDataTickMessage'
          - $ref: '#/components/schemas/WebhookNotificationMessage'
          - $ref: '#/components/schemas/ZohoCRMRecordUpdateMessage'
          - $ref: '#/components/schemas/ZohoCallActivityMessage'
          - $ref: '#/components/schemas/StaleCallCleanupMessage'
          - $ref: '#/components/schemas/CallQueuedHealthCheckMessage'
          - $ref: '#/components/schemas/CallInProgressHealthCheckMessage'
          - $ref: '#/components/schemas/CallRetryMessage'
          - $ref: '#/components/schemas/VoiceMigrationMessage'
          - $ref: '#/components/schemas/CallReportsEnqueueMessage'
          - $ref: '#/components/schemas/ScenarioGenerationMessage'
          - $ref: '#/components/schemas/ProcessMessagingMessage'
          - $ref: '#/components/schemas/CreateDefaultAgentsMessage'
          - $ref: '#/components/schemas/UpdateScenarioAgentMessage'
          - $ref: '#/components/schemas/SlackAlertMessage'
          - $ref: '#/components/schemas/ConversationExportMessage'
          - $ref: '#/components/schemas/DispatchOutboundCallMessage'
          - $ref: '#/components/schemas/NoOpMessage'
          title: Message
          discriminator:
            propertyName: type
            mapping:
              batch_calls_retry: '#/components/schemas/BatchCallsRetryMessage'
              batch_report_generation: '#/components/schemas/BatchReportGenerationMessage'
              call_in_progress_health_check: '#/components/schemas/CallInProgressHealthCheckMessage'
              call_outcome: '#/components/schemas/CallOutcomeMessage'
              call_queued_health_check: '#/components/schemas/CallQueuedHealthCheckMessage'
              call_reports_enqueue: '#/components/schemas/CallReportsEnqueueMessage'
              call_retry: '#/components/schemas/CallRetryMessage'
              conversation_export: '#/components/schemas/ConversationExportMessage'
              create_batch_calls: '#/components/schemas/CreateBatchCallsMessage'
              create_default_agents: '#/components/schemas/CreateDefaultAgentsMessage'
              delete_expired_org_data_tick: '#/components/schemas/DeleteExpiredOrgDataTickMessage'
              delete_old_tasks_tick: '#/components/schemas/DeleteOldTasksTickMessage'
              dispatch_outbound_call: '#/components/schemas/DispatchOutboundCallMessage'
              enhanced_transcription: '#/components/schemas/EnhancedTranscriptionMessage'
              no_op: '#/components/schemas/NoOpMessage'
              outbound_dispatch_tick: '#/components/schemas/OutboundDispatchTickMessage'
              process_messaging_message: '#/components/schemas/ProcessMessagingMessage'
              scenario_generation: '#/components/schemas/ScenarioGenerationMessage'
              scenario_insight_analysis: '#/components/schemas/ScenarioInsightAnalysisMessage'
              slack_alert: '#/components/schemas/SlackAlertMessage'
              stale_call_cleanup: '#/components/schemas/StaleCallCleanupMessage'
              start_batch_calls_tick: '#/components/schemas/StartBatchCallsTickMessage'
              update_scenario_agent: '#/components/schemas/UpdateScenarioAgentMessage'
              voice_migration: '#/components/schemas/VoiceMigrationMessage'
              webhook_notification: '#/components/schemas/WebhookNotificationMessage'
              zoho_call_activity: '#/components/schemas/ZohoCallActivityMessage'
              zoho_crm_record_update: '#/components/schemas/ZohoCRMRecordUpdateMessage'
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
        batch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch Id
      type: object
      required:
      - message
      title: CreateTaskRequest
    HamsaTTSDialect:
      type: string
      enum:
      - pls
      - egy
      - syr
      - irq
      - jor
      - leb
      - ksa
      - uae
      - bah
      - qat
      - msa
      title: HamsaTTSDialect
    EnhancedTranscriptionMessage:
      properties:
        type:
          type: string
          const: enhanced_transcription
          title: Type
          default: enhanced_transcription
        call_id:
          type: string
          title: Call Id
      type: object
      required:
      - call_id
      title: EnhancedTranscriptionMessage
    SarjF5TTSSettings:
      properties:
        provider:
          type: string
          const: sarj_f5
          title: Provider
        voice:
          $ref: '#/components/schemas/SarjF5TTSVoice'
          default: Male
      type: object
      required:
      - provider
      title: SarjF5TTSSettings
    DisableSTTFallback:
      properties:
        type:
          type: string
          const: disable
          title: Type
          default: disable
      type: object
      title: DisableSTTFallback
    DeleteOldTasksTickMessage:
      properties:
        type:
          type: string
          const: delete_old_tasks_tick
          title: Type
          default: delete_old_tasks_tick
        tick_id:
          type: string
          title: Tick Id
      type: object
      title: DeleteOldTasksTickMessage
    ZohoCallActivityMessage:
      properties:
        type:
          type: string
          const: zoho_call_activity
          title: Type
          default: zoho_call_activity
        call_id:
          type: string
          title: Call Id
        record_id:
          type: string
          title: Record Id
        module:
          $ref: '#/components/schemas/ZohoCRMModules'
          default: Leads
      type: object
      required:
      - call_id
      - record_id
      title: ZohoCallActivityMessage
    CallCreationSettings:
      properties:
        identity:
          type: string
          title: Identity
        language:
          $ref: '#/components/schemas/Language'
        scenario:
          $ref: '#/components/schemas/CustomScenario'
        callee:
          anyOf:
          - $ref: '#/components/schemas/CallSubject'
          - type: 'null'
        call_id:
          type: string
          title: Call Id
        origin:
          anyOf:
          - $ref: '#/components/schemas/ApiCall'
          - $ref: '#/components/schemas/SipCall'
          - type: 'null'
          title: Origin
        scenario_config:
          $ref: '#/components/schemas/Custom'
        interaction_type:
          $ref: '#/components/schemas/InteractionType'
          default: voice
        metadata:
          additionalProperties: true
          type: object
          title: Metadata
        app_settings:
          anyOf:
          - $ref: '#/components/schemas/GlobalOverriddenSettings'
          - $ref: '#/components/schemas/GlobalDefaultSettings'
          title: App Settings
        organization_id:
          type: string
          title: Organization Id
        sip_account_id:
          anyOf:
          - type: integer
          - type: 'null'
          title: Sip Account Id
      type: object
      required:
      - identity
      - language
      - scenario
      - call_id
      - scenario_config
      - app_settings
      - organization_id
      title: CallCreationSettings
    BackChannelConfig:
      properties:
        type:
          type: string
          const: freq
          title: Type
          default: freq
        value:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Value
          default: 0.6
        whitelist:
          items:
            type: string
          type: array
          title: Whitelist
      type: object
      title: BackChannelConfig
    Custom:
      properties:
        type:
          type: string
          const: custom
          title: Type
          default: custom
        scenario:
          $ref: '#/components/schemas/CustomScenario'
      type: object
      required:
      - scenario
      title: Custom
    Task:
      properties:
        id:
          type: string
          title: Id
        organization_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Organization Id
        user_id:
          anyOf:
          - type: string
          - type: 'null'
          title: User Id
        call_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Call Id
        batch_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Batch Id
        type:
          $ref: '#/components/schemas/TaskType'
        status:
          $ref: '#/components/schemas/TaskStatus'
        status_changed_at:
          type: string
          format: date-time
          title: Status Changed At
        message:
          oneOf:
          - $ref: '#/components/schemas/EnhancedTranscriptionMessage'
          - $ref: '#/components/schemas/CallOutcomeMessage'
          - $ref: '#/components/schemas/ScenarioInsightAnalysisMessage'
          - $ref: '#/components/schemas/BatchReportGenerationMessage'
          - $ref: '#/components/schemas/CreateBatchCallsMessage'
          - $ref: '#/components/schemas/BatchCallsRetryMessage'
          - $ref: '#/components/schemas/StartBatchCallsTickMessage'
          - $ref: '#/components/schemas/DeleteOldTasksTickMessage'
          - $ref: '#/components/schemas/OutboundDispatchTickMessage'
          - $ref: '#/components/schemas/DeleteExpiredOrgDataTickMessage'
          - $ref: '#/components/schemas/WebhookNotificationMessage'
          - $ref: '#/components/schemas/ZohoCRMRecordUpdateMessage'
          - $ref: '#/components/schemas/ZohoCallActivityMessage'
          - $ref: '#/components/schemas/StaleCallCleanupMessage'
          - $ref: '#/components/schemas/CallQueuedHealthCheckMessage'
          - $ref: '#/components/schemas/CallInProgressHealthCheckMessage'
          - $ref: '#/components/schemas/CallRetryMessage'
          - $ref: '#/components/schemas/VoiceMigrationMessage'
          - $ref: '#/components/schemas/CallReportsEnqueueMessage'
          - $ref: '#/components/schemas/ScenarioGenerationMessage'
          - $ref: '#/components/schemas/ProcessMessagingMessage'
          - $ref: '#/components/schemas/CreateDefaultAgentsMessage'
          - $ref: '#/components/schemas/UpdateScenarioAgentMessage'
          - $ref: '#/components/schemas/SlackAlertMessage'
          - $ref: '#/components/schemas/ConversationExportMessage'
          - $ref: '#/components/schemas/DispatchOutboundCallMessage'
          - $ref: '#/components/schemas/NoOpMessage'
          title: Message
          discriminator:
            propertyName: type
            mapping:
              batch_calls_retry: '#/components/schemas/BatchCallsRetryMessage'
              batch_report_generation: '#/components/schemas/BatchReportGenerationMessage'
              call_in_progress_health_check: '#/components/schemas/CallInProgressHealthCheckMessage'
              call_outcome: '#/components/schemas/CallOutcomeMessage'
              call_queued_health_check: '#/components/schemas/CallQueuedHealthCheckMessage'
              call_reports_enqueue: '#/components/schemas/CallReportsEnqueueMessage'
              call_retry: '#/components/schemas/CallRetryMessage'
              conversation_export: '#/components/schemas/ConversationExportMessage'
              create_batch_calls: '#/components/schemas/CreateBatchCallsMessage'
              create_default_agents: '#/components/schemas/CreateDefaultAgentsMessage'
              delete_expired_org_data_tick: '#/components/schemas/DeleteExpiredOrgDataTickMessage'
              delete_old_tasks_tick: '#/components/schemas/DeleteOldTasksTickMessage'
              dispatch_outbound_call: '#/components/schemas/DispatchOutboundCallMessage'
              enhanced_transcription: '#/components/schemas/EnhancedTranscriptionMessage'
              no_op: '#/components/schemas/NoOpMessage'
              outbound_dispatch_tick: '#/components/schemas/OutboundDispatchTickMessage'
              process_messaging_message: '#/components/schemas/ProcessMessagingMessage'
              scenario_generation: '#/components/schemas/ScenarioGenerationMessage'
              scenario_insight_analysis: '#/components/schemas/ScenarioInsightAnalysisMessage'
              slack_alert: '#/components/schemas/SlackAlertMessage'
              stale_call_cleanup: '#/components/schemas/StaleCallCleanupMessage'
              start_batch_calls_tick: '#/components/schemas/StartBatchCallsTickMessage'
              update_scenario_agent: '#/components/schemas/UpdateScenarioAgentMessage'
              voice_migration: '#/components/schemas/VoiceMigrationMessage'
              webhook_notification: '#/components/schemas/WebhookNotificationMessage'
              zoho_call_activity: '#/components/schemas/ZohoCallActivityMessage'
              zoho_crm_record_update: '#/components/schemas/ZohoCRMRecordUpdateMessage'
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - type
      - status
      - status_changed_at
      - message
      - created_at
      - updated_at
      title: Task
    SlackAlertMessage:
      properties:
        type:
          type: string
          const: slack_alert
          title: Type
          default: slack_alert
        payload:
          $ref: '#/components/schemas/GenericSlackAlert'
      type: object
      required:
      - payload
      title: SlackAlertMessage
    NoOpMessage:
      properties:
        type:
          type: string
          const: no_op
          title: Type
          default: no_op
      type: object
      title: NoOpMessage
    SarjCustomSTTSettings:
      properties:
        provider:
          type: string
          const: sarj_custom
          title: Provider
      type: object
      required:
      - provider
      title: SarjCustomSTTSettings
    AWSTTSSettings:
      properties:
        provider:
          type: string
          const: aws
          title: Provider
        region:
          type: string
          enum:
          - eu-central-1
          - us-east-1
          title: Region
          default: eu-central-1
      type: object
      required:
      - provider
      title: AWSTTSSettings
    TaskPagination:
      properties:
        tasks:
          items:
            $ref: '#/components/schemas/Task'
          type: array
          title: Tasks
        has_next:
          type: boolean
          title: Has Next
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Next Cursor
      type: object
      required:
      - tasks
      - has_next
      title: TaskPagination
    SarjEouTurnDetection:
      properties:
        type:
          type: string
          const: sarj_eou
          title: Type
          default: sarj_eou
        threshold:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Threshold
          default: 0.5
        prediction_timeout:
          type: string
          format: duration
          title: Prediction Timeout
          default: PT0.5S
        min_endpointing_delay:
          type: string
          format: duration
          title: Min Endpointing Delay
          default: PT0.5S
        max_endpointing_delay:
          type: string
          format: duration
          title: Max Endpointing Delay
          default: PT3S
        targeted_stt_providers:
          items:
            $ref: '#/components/schemas/STTProvider'
          type: array
          title: Targeted Stt Providers
      type: object
      title: SarjEouTurnDetection
    GlobalOverriddenSettings:
      properties:
        type:
          type: string
          const: override
          title: Type
          default: override
        settings:
          additionalProperties:
            $ref: '#/components/schemas/GlobalSettings'
          propertyNames:
            $ref: '#/components/schemas/Language'
          type: object
          title: Settings
      type: object
      required:
      - settings
      title: GlobalOverriddenSettings
    StaleCallCleanupMessage:
      properties:
        type:
          type: string
          const: stale_call_cleanup
          title: Type
          default: stale_call_cleanup
      type: object
      title: StaleCallCleanupMessage
    TTSVoice:
      properties:
        id:
          type: string
          title: Id
        display_name:
          type: string
          title: Display Name
        provider:
          type: string
          title: Provider
        language:
          $ref: '#/components/schemas/Language'
        gender:
          $ref: '#/components/schemas/Gender'
        tts_settings:
          anyOf:
          - $ref: '#/components/schemas/ElevenLabsTTSSettings'
          - $ref: '#/components/schemas/AzureTTSSettings'
          - $ref: '#/components/schemas/OpenAITTSSettings'
          - $ref: '#/components/schemas/AWSTTSSettings'
          - $ref: '#/components/schemas/GroqTTSSettings'
          - $ref: '#/components/schemas/HamsaTTSSettings'
          - $ref: '#/components/schemas/CartesiaTTSSettings'
          - $ref: '#/components/schemas/DeepgramTTSSettings'
          - $ref: '#/components/schemas/SarjF5TTSSettings'
          - $ref: '#/components/schemas/SarjOmniTTSSettings'
          title: Tts Settings
        is_active:
          type: boolean
          title: Is Active
          default: true
        vibe:
          type: string
          title: Vibe
        created_at:
          type: string
          format: date-time
          title: Created At
        updated_at:
          type: string
          format: date-time
          title: Updated At
      type: object
      required:
      - id
      - display_name
      - provider
      - language
      - gender
      - tts_settings
      - vibe
      - created_at
      - updated_at
      title: TTSVoice
    OpenAILLMSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        region:
          type: string
          const: default
          title: Region
          default: default
        model:
          $ref: '#/components/schemas/OpenAIModel'
      type: object
      required:
      - provider
      - model
      title: OpenAILLMSettings
    ApiCall:
      properties:
        type:
          type: string
          const: api
          title: Type
          default: api
        call_id:
          type: string
          title: Call Id
        identity:
          type: string
          title: Identity
      type: object
      required:
      - call_id
      - identity
      title: ApiCall
    CallReportsEnqueueMessage:
      properties:
        type:
          type: string
          const: call_reports_enqueue
          title: Type
          default: call_reports_enqueue
      type: object
      title: CallReportsEnqueueMessage
    CallInProgressHealthCheckMessage:
      properties:
        type:
          type: string
          const: call_in_progress_health_check
          title: Type
          default: call_in_progress_health_check
        call_id:
          type: string
          title: Call Id
      type: object
      required:
      - call_id
      title: CallInProgressHealthCheckMessage
    BackChannelMixConfig:
      properties:
        type:
          type: string
          const: mix
          title: Type
          default: mix
        value:
          type: number
          maximum: 1.0
          exclusiveMinimum: 0.0
          title: Value
          default: 0.6
        word_probability:
          type: number
          maximum: 1.0
          minimum: 0.0
          title: Word Probability
          default: 0.7
        whitelist:
          items:
            type: string
          type: array
          title: Whitelist
        sounds:
          items:
            $ref: '#/components/schemas/BackchannelAudioConfig'
          type: array
          minItems: 1
          title: Sounds
      type: object
      required:
      - sounds
      title: BackChannelMixConfig
    GeminiLLMSettings:
      properties:
        provider:
          type: string
          const: gemini
          title: Provider
        region:
          type: string
          enum:
          - us-central1
          - me-central2
          - us-east1
          - europe-west1
          - europe-west3
          title: Region
          default: europe-west3
        model:
          type: string
          enum:
          - flash
          - pro
          - flash-lite-3.1
          title: Model
          default: flash
      type: object
      required:
      - provider
      title: GeminiLLMSettings
    CallOutcomeMessage:
      properties:
        type:
          type: string
          const: call_outcome
          title: Type
          default: call_outcome
        call_id:
          type: string
          title: Call Id
        is_retry:
          type: boolean
          title: Is Retry
          default: false
      type: object
      required:
      - call_id
      title: CallOutcomeMessage
    OpenAISTTSettings:
      properties:
        provider:
          type: string
          const: openai
          title: Provider
        model:
          type: string
          enum:
          - gpt-4o-transcribe
          - gpt-4o-mini-transcribe
          title: Model
        region:
          type: string
          const: default
          title: Region
          default: default
      type: object
      required:
      - provider
      - model
      title: OpenAISTTSettings
    GroqSTTSettings:
      properties:
        provider:
          type: string
