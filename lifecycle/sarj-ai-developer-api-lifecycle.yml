status_page:
  published: false
  publicly_readable: false
  gated: true
  probe:
    url: https://status.sarj.ai
    http_status: 200
    resolves_to: https://main-bulbul-pages.cloudflareaccess.com/cdn-cgi/access/login/status.sarj.ai
    detail: >-
      CHANGED since 2026-08, and it is worth stating precisely. status.sarj.ai is no longer a bare redirect
      landing page: it is now a real application sitting behind Cloudflare Access. A request is 302'd to a
      Cloudflare Access sign-in page ("Sign in ・ Cloudflare Access", 35354 bytes) with an Access JWT
      challenge naming hostname status.sarj.ai. Something is deployed there. It is not a bot challenge we
      could pass with a browser User-Agent — it is an identity gate, so an integrator without a Sarj.ai
      identity cannot read it and cannot subscribe to it.
    verdict: >-
      Exists but is not a public status page. No StatusPage pointer is emitted: the check asks whether a
      consumer can see incident state, and here they cannot.
