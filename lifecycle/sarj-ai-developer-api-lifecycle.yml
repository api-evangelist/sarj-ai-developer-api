roadmap:
  published: false
  note: >-
    The nearest thing to a published roadmap is a sentence inside the createScheduleConfig description:
    "This endpoint is create-only today — there is no way to fetch, list, update, or disable a config after
    creation; that ships in a follow-up." A commitment to future work stated in an operation description is
    better than silence, but it is not a roadmap and carries no date.
