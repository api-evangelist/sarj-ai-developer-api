  detail: >-
    No deprecation policy is published and no operation in any of the four harvested specs carries
    `deprecated: true`. No Sunset or Deprecation response headers are declared. There is no stated notice
    period for breaking changes. The 2026-09 refresh did find the provider deprecating in practice, at the
    FIELD level, with no policy behind it — see deprecated_fields below.
deprecated_operations: []
deprecated_fields:
  - field: PublicCallDetail.recording_url
    replacement: PublicCallDetail.permanent_recording_url
    marker: prose in the field description ("DEPRECATED — use `permanent_recording_url`")
    machine_readable: false
    sunset_date: null
    source: openapi/_original/sarj-ai-developer-api-developer-openapi.json
    detail: >-
      Found 2026-09-11. The spec says the deprecated field's signed URL "expires 24 hours after issue once
      the recording-endpoint rollout is enabled on this deployment (7 days before then)". The expiry of a
      field an integrator is already using therefore depends on a rollout flag the caller cannot observe,
      announced nowhere, with no date attached. JSON Schema has a `deprecated: true` keyword and OpenAPI 3.1
      honours it; the field does not carry it, so no tooling will flag it.
    finding: >-
      This is the first observed breaking-ish change on the public contract, and it demonstrates the gap the
      missing deprecation policy leaves: the change is real, it is dated by an internal flag, and the only
      notice is a word in a description.
