findings:
  - id: no-change-communication
    detail: >-
      No changelog, no deprecation policy, no Sunset headers and no roadmap. An integrator has no published mechanism
      to learn that anything changed. Combined with a mostly-beta path namespace, this is the weakest area of the
      provider's operational posture.
  - id: additive-change-without-announcement
    detail: >-
      Four public operations shipped in a month behind an unchanged info.version of 1.0.0. Additive change is
      safe, so nothing broke — but an integrator has no mechanism to learn that the API can now cancel a call,
      which is the single most useful thing it gained.
  - id: version-drift-across-services
    detail: >-
      Four specs at four different info.version values (1.0.0, 1.0.0, 1.0.2, 0.3.0) with no shared release train and
      no changelog tying them together.
