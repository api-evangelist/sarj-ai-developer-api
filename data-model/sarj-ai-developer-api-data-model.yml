relationships:
  - from: Call
    to: Scenario
    type: belongs_to
    via: scenario_id
    note: Required on creation; the scenario is not resolvable through the public API.
  - from: Call
    to: Organization
    type: belongs_to
    via: implicit (API key binding)
  - from: Call
    to: TranscriptMessage
    type: has_many
    via: transcript
  - from: Call
    to: CallReport
    type: has_one
    via: report
    cardinality_note: Zero-or-one — absent until generated, and never generated for non-completed calls.
  - from: CallReport
    to: SuccessCriteriaResult
    type: has_many
    via: success_criteria_results
  - from: Call
    to: ScheduleConfig
    type: belongs_to
    via: schedule_config_id
    optional: true
    note: >-
      Omitted, the scenario's default schedule config applies automatically when one is configured — so a call
      can inherit a retry policy the caller never named.
  - from: ScheduleConfig
    to: TimeWindow
    type: has_one
    via: retry_window
    optional: true
  - from: TimeWindow
    to: TimeEdge
    type: has_many
    via: start_edge, end_edge
  - from: Call
    to: Call
    type: has_many
    via: root_call_id
    relationship: retry_chain
    source: https://platform-docs.sarj.ai/webhooks
    note: >-
      A self-referencing relationship that exists only in the webhook payload, never in a REST response. Each
      retry dial is its own Call; root_call_id points at the first attempt and is null on that attempt itself.
      There is no API operation that returns the members of a chain — an integrator can only assemble it from
      the webhooks it received.
  - from: VoiceProfile
    to: Voice
    type: belongs_to
    via: voice_id
    confidence: medium
    note: Inferred from the TTS path structure (/v1/voices/profiles); not asserted by a $ref in the spec.
