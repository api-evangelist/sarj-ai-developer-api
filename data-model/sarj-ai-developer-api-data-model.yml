findings:
  - id: scenario-is-a-hole-in-the-model
    detail: >-
      Scenario is the central object of the product — a call cannot be placed without one — yet it has no schema, no
      operations and no way to be listed, created or validated through the API. An agent cannot discover which
      scenario IDs it is allowed to use; it must be told one out of band.
  - id: no-list-operation
    detail: >-
      The public developer API exposes no way to enumerate calls. Every read is by known call_id, so the only durable
      record of what was called is the integrator's own or the dashboard's.
  - id: retry-chain-is-webhook-only
    detail: >-
      The Call-to-Call retry relationship is documented only in the webhook payload. A consumer that polls
      instead of subscribing cannot reconstruct which dials belong to the same contact, which means polling
      and webhooks do not return the same information model.
  - id: schedule-config-is-write-once
    detail: >-
      ScheduleConfig can be created and referenced but never read back, listed, changed or disabled through
      the API. The entity exists in the model with no retrieval path — the provider states a follow-up will
      add one.
