findings:
  - id: scenario-is-a-hole-in-the-model
    detail: >-
      Scenario is the central object of the product — a call cannot be placed without one — yet it has no schema, no
      operations and no way to be listed, created or validated through the API. An agent cannot discover which
      scenario IDs it is allowed to use; it must be told one out of band.
  - id: no-list-operation
    detail: >-
      The public developer API exposes no way to enumerate calls. Every read is by known call_id, so the only durable
      record of what was called is the integrator's own or the dashboard's.
