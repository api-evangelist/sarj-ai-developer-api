pointer_note: >-
  No `Sandbox` pointer is wired into apis.yml, because a pointer of that type asserts the provider publishes
  a sandbox and they do not. A `Console` pointer IS wired, to
  https://platform-docs.sarj.ai/api-reference — the docs do ship a real interactive request playground
  (Mintlify "Try it", confirmed in the rendered page markup), which is a genuine try-before-you-build surface
  even though it fires against production.
summary: >-
  Sarj.ai publishes no sandbox, no test-mode key prefix and no simulated phone numbers. There is exactly one
  published test affordance — a dashboard button that fires a synthetic webhook — and one unauthenticated
  endpoint an integrator can call for free. Everything else is live: the first call an integrator places is a
  real, billable telephone call to a real number.
facilities:
  - id: send-test-webhook
    kind: fixture-trigger
    surface: dashboard
    url: https://platform.sarj.ai
    api_available: false
    detail: >-
      "The dashboard offers a 'Send test webhook' button to fire a synthetic `complete` payload at your URL —
      use this while standing up the integration." Dashboard-only; there is no API operation to trigger it, so
      it cannot be wired into CI or driven by an agent.
    source: https://platform-docs.sarj.ai/webhooks
  - id: unauthenticated-health-check
    kind: free-probe
    operation: getHealth
    url: https://platform-api.sarj.ai/api/v1/health
    auth_required: false
    http_status: 200
    response: '{"data":{"status":"ok"},"meta":{"request_id":"..."}}'
    detail: >-
      The only operation callable with no credential. Documented in Getting Started as the setup verification
      step, and genuinely usable as a connectivity smoke test.
  - id: scheduled-call-as-dry-run
    kind: deferred-execution
    operation: createCall
    parameter: scheduled_at
    detail: >-
      Not a sandbox, but the nearest published substitute: booking a call at least 10 minutes ahead creates it
      in status `scheduled` and leaves a window in which cancelScheduledCall can abort it before any dialing or
      billing occurs. An integrator can exercise create → inspect → cancel end-to-end without placing a call.
      The provider does not frame it this way; this is our reading of the contract, recorded as a derivation.
    method: derived
