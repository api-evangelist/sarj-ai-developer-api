findings:
  - id: no-safe-first-call
    detail: >-
      Every documented path to a first successful createCall dials a real phone. Comparable voice and telephony
      providers publish magic test numbers (Twilio's +15005550006 range) precisely so integration work does not
      ring a human. Sarj.ai publishes none, and the Getting Started guide's worked example is a live E.164
      number in the Saudi range.
  - id: test-webhook-is-dashboard-only
    detail: >-
      The one fixture tool that exists cannot be reached from code. An agent or CI pipeline standing up a
      webhook receiver must have a human click a button in the dashboard.
