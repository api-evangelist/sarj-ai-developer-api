generated: '2026-08-09'
method: searched
docs: https://platform-docs.sarj.ai/getting-started
source: >-
  https://platform-docs.sarj.ai/getting-started, https://platform-docs.sarj.ai/webhooks,
  openapi/sarj-ai-developer-api-developer-openapi.json, openapi/sarj-ai-developer-api-voice-platform-openapi.json
authentication:
  style: bearer-api-key
  header: 'Authorization: Bearer <api-key>'
  see: authentication/sarj-ai-developer-api-authentication.yml
response_envelope:
  success:
    shape: '{"data": {...}, "meta": {"request_id": "..."}}'
    data_member: data
    meta_member: meta
  error:
    shape: '{"error": {"type": "...", "message": "..."}, "meta": {"request_id": "..."}}'
    discriminator: error.type
    guidance: Branch on error.type; message is for humans only.
    see: errors/sarj-ai-developer-api-problem-types.yml
  consistency_note: >-
    The envelope is applied uniformly across the developer API. The Speech-to-Text and Text-to-Speech APIs do NOT use
    it — they are OpenAI-compatible and return OpenAI-shaped bodies (or raw audio) instead. An integrator crossing
    from the call API to the speech APIs changes response contract as well as host.
request_tracing:
  header: X-Request-ID
  bidirectional: true
  request_side: >-
    Supply your own X-Request-ID request header (max 128 chars, ASCII printable); otherwise the server generates a
    UUID v4.
  response_side: Mirrored in the X-Request-ID response header and in meta.request_id on every response.
  support_guidance: Include meta.request_id in support tickets.
  quality: >-
    Client-supplied correlation IDs echoed on both success and error responses is a strong tracing contract and is
    documented in the spec itself, not only in prose.
idempotency:
  supported: false
  request_header: null
  detail: >-
    No Idempotency-Key header, parameter or equivalent appears in any of the four harvested OpenAPI documents, and the
    documentation describes none. POST /calls places a real, billable phone call, so a retried or duplicated request
    dials the recipient again. Callers must deduplicate before sending.
  consumer_side_requirement: >-
    Idempotency is required in the opposite direction: webhook receivers must be idempotent and deduplicate on
    call_id, because Sarj retries a delivery up to 3 times and the same call_id may arrive more than once.
  gap: >-
    This is the clearest remediation available to Sarj. An Idempotency-Key on POST /calls would make agent-driven
    calling safe to retry; today an agent that times out on createCall cannot safely retry it.
pagination:
  style: cursor
  applies_to: openapi/sarj-ai-developer-api-voice-platform-openapi.json
  request_params:
    - name: cursor
      in: query
    - name: limit
      in: query
  sorting:
    - name: sort_by
      in: query
    - name: sort_order
      in: query
  filtering:
    - date_from
    - date_to
    - direction
    - language
    - scenario_id
    - phone_number
  note: >-
    The 3-operation public developer API has no list endpoint at all, so pagination is invisible to developer-portal
    readers — there is no way to enumerate your calls through the documented API. Cursor pagination exists only on the
    platform spec served at the API host root.
versioning:
  scheme: uri-path
  current: v1
  base_path: /api/v1
  stability_markers:
    - marker: /v1/beta/
      detail: >-
        Most operations on the platform spec sit under a /v1/beta/ path segment, signalling beta status inside a v1
        namespace. The 3 public developer operations are NOT under /beta/.
  see: lifecycle/sarj-ai-developer-api-lifecycle.yml
rate_limiting:
  signal: error-only
  headers: none
  detail: >-
    No X-RateLimit-* headers and no Retry-After are declared in any spec. The only published limit signal is the
    429 call_limit_exceeded error payload, which returns the offending phone_number and the call_limit that was hit.
    No numeric quotas are published anywhere, so no rate-limits artifact could be built.
async_semantics:
  create_call:
    status: 202 Accepted
    detail: createCall returns 202 with a queued call; the call itself is asynchronous.
  call_status_progression:
    happy_path:
      - queued
      - in_progress
      - completed
    terminal_states:
      - completed
      - timeout
      - user_rejected
      - max_duration_reached
      - failed
      - voicemail
      - cancelled
      - expired
      - transferred
  report_generation:
    async: true
    typical_delay: ~2 minutes after call completion
    caveat: >-
      The report field is null immediately after completion. Calls that never complete never get one, and the docs
      state that in rare cases even a completed call never receives a report — so callers must cap polling and treat
      the webhook as authoritative.
  polling_vs_webhooks:
    guidance: >-
      "Polling alone is unreliable; use webhooks for production." Documented in both Getting Started and the
      provider's Agent Skill.
    see: asyncapi/sarj-ai-developer-api-webhooks.yml
identifiers:
  - entity: call
    prefix: call_
    format: 'call_ + UUID (e.g. call_8f9b2c1e-4a5d-4f6e-8b1a-2c3d4e5f6a7b)'
  - entity: scenario
    prefix: scn_
    created_in: dashboard only
  - entity: api_key
    prefix: sk-
    note: Documented in the Getting Started export example.
field_conventions:
  phone_numbers: E.164 required, leading + and country code, no spaces or dashes
  timestamps: ISO 8601 UTC (created_at, started_at, ended_at)
  durations: integer seconds, null until the call ends
  languages: [en, ar, ur]
  language_default: ar
  signed_urls: >-
    recording_url is a signed, time-limited Google Cloud Storage URL. Download promptly or re-fetch a fresh URL via
    getCall.
expansion: none
metadata:
  supported: true
  field: variables
  detail: Free-form object of template variables injected into the scenario at call time.
cross_links:
  errors: errors/sarj-ai-developer-api-problem-types.yml
  lifecycle: lifecycle/sarj-ai-developer-api-lifecycle.yml
  authentication: authentication/sarj-ai-developer-api-authentication.yml
  webhooks: asyncapi/sarj-ai-developer-api-webhooks.yml
  scopes: scopes/sarj-ai-developer-api-scopes.yml
