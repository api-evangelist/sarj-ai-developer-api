  - url: https://platform-docs.sarj.ai/.well-known/openid-configuration
    status: 308
    reason: >-
      In the 2026-08 pass this path returned 200 with the 203368-byte Mintlify SPA shell and was correctly
      rejected as a soft 404. The docs host now answers 308 to / instead, which is an improvement — the soft
      200 is gone.
findings:
  - id: api-catalog-advertised-but-404
    detail: >-
      platform-docs.sarj.ai advertises </.well-known/api-catalog>; rel="api-catalog" on every response and
      serves a 404 there. This is the cheapest fix on the whole surface: the provider already believes it
      publishes an API catalog. Until it does, no APICatalog/WellKnown credit is claimed for that path.
  - id: two-agent-surfaces-one-host
    detail: >-
      platform-docs.sarj.ai now serves four live agent-facing discovery documents — agent card, MCP server
      card, agent-skills index and the skill itself — while the API host serves only OAuth metadata. The
      agent surface and the API surface are on different hosts, which is why a probe limited to the API host
      finds almost nothing.
