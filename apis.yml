    description: >-
      REST API for placing outbound voice calls and retrieving call status, signed recording URL, transcript, and the
      asynchronous post-call outcome report. Also exposes a hosted MCP server with createCall/getCall tools bound 1:1
      to the REST operations.
    humanURL: https://platform-docs.sarj.ai
