name: Sarj AI Developer API
description: Sarj.ai is a voice and chat AI agent platform built for Arabic, English and Urdu, focused
  on the Saudi and wider MENA market. The public developer surface is a REST API for outbound voice calls
  — place a call against a saved scenario (immediately, or booked up to 30 days ahead), cancel or reschedule
  it while it is still pending, create a retry policy governing how often a number is re-dialed, and retrieve
  the call's status, recording, transcript and asynchronous post-call outcome report. Alongside the call
  API, Sarj publishes two OpenAI-compatible speech APIs (Speech-to-Text with streaming, and Text-to-Speech
  with voice cloning), a hosted MCP server exposing createCall and getCall as native agent tools, a second
  unauthenticated MCP server over its documentation, an A2A agent card, a published Agent Skill with an
  agentskills.io discovery index, an llms.txt, webhook push notifications covering eleven call outcomes,
  and an official Python SDK.
