  - name: Sarj Speech-to-Text API
    description: >-
      OpenAI-compatible Speech-to-Text API for Arabic and multilingual audio. Accepts multipart/form-data audio uploads
      at POST /openai/v1/audio/transcriptions using the conformer model, returning json, text or verbose_json. Supports
      both batch transcription of complete files and low-latency real-time streaming.
    humanURL: https://platform-docs.sarj.ai/speech-to-text
    baseURL: https://stt-rnnt-ar.sarj.ai/openai/v1
    tags:
      - speech to text
      - transcription
      - Arabic AI
      - conversational AI
      - OpenAI compatible
      - streaming
    properties:
      - type: OpenAPI
        url: openapi/sarj-ai-developer-api-stt-openapi.json
      - type: OpenAPI
        url: https://stt-rnnt-ar.sarj.ai/openapi.json
      - type: Overlay
        url: overlays/sarj-ai-developer-api-stt-overlay.yaml
      - type: Documentation
        url: https://platform-docs.sarj.ai/speech-to-text
  - name: Sarj Text-to-Speech API
    description: >-
      OpenAI-compatible Text-to-Speech API producing natural Saudi Arabic and multilingual speech at POST
      /v1/audio/speech, with voice cloning from a 6-10 second reference sample at POST /v1/audio/speech/clone. Also
      exposes voice profile management, a voice catalog and a model catalog.
    humanURL: https://platform-docs.sarj.ai/text-to-speech
    baseURL: https://sarj-omni-tts.sarj.ai/v1
    tags:
      - text to speech
      - speech synthesis
      - voice cloning
      - Arabic AI
      - conversational AI
      - OpenAI compatible
    properties:
      - type: OpenAPI
        url: openapi/sarj-ai-developer-api-tts-openapi.json
      - type: OpenAPI
        url: https://sarj-omni-tts.sarj.ai/openapi.json
      - type: Overlay
        url: overlays/sarj-ai-developer-api-tts-overlay.yaml
      - type: Documentation
        url: https://platform-docs.sarj.ai/text-to-speech
