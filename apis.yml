name: Sarj AI Developer API
description: >-
  Sarj.ai is a voice and chat AI agent platform built for Arabic, English and Urdu, focused on the Saudi and wider MENA
  market. The public developer surface is a REST API for outbound voice calls — place a call against a saved scenario,
  then retrieve its status, signed recording URL, transcript and asynchronous post-call outcome report. Alongside the
  call API, Sarj publishes two OpenAI-compatible speech APIs (Speech-to-Text with streaming, and Text-to-Speech with
  voice cloning), a hosted MCP server exposing createCall and getCall as native agent tools, an A2A agent card, a
  published Agent Skill, an llms.txt, webhook push notifications for call completion, and an official Python SDK.
url: https://raw.githubusercontent.com/api-evangelist/sarj-ai-developer-api/refs/heads/main/apis.yml
image: https://www.sarj.ai/og-image.png
