format_note: >-
  Not RFC 9457. Errors are returned as application/json with a Sarj envelope, not application/problem+json, and there
  is no `type` URI, `title`, `detail`, `instance` or `status` member. The envelope is
  {"error": {"type", "message", ...}, "meta": {"request_id"}}. The `type` member is a stable machine-readable slug,
  and the OpenAPI models it as a discriminated union — so the taxonomy is genuinely typed, just not the IETF shape.
envelope:
