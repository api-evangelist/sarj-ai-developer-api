findings:
  - id: typed-discriminated-union
    detail: >-
      Seventeen error types modelled as a oneOf with an explicit OpenAPI discriminator on error.type, each with its own
      payload fields (up from thirteen — the 2026-09 refresh added call_not_pending, scheduling_disabled,
      invalid_schedule_time and schedule_config_not_found alongside the scheduling operations). This is unusually good machine-readable error design for an API of this size — an agent can
      branch deterministically without string-matching messages.
  - id: not-rfc9457
    detail: >-
      Uses a vendor envelope rather than application/problem+json. Adopting RFC 9457 (or simply adding a `type` URI
      and `status` member) would make the taxonomy portable to generic problem-details tooling.
  - id: no-error-reference-page
    detail: >-
      The documentation has no error reference page. The full taxonomy exists only inside the OpenAPI component
      schemas; a human reading the docs sees only the envelope shape in Getting Started.
  - id: entitlement-errors-are-not-failures
    detail: >-
      `scheduling_disabled` (403) is not a caller mistake — it says the tenant does not have the feature. An agent
      needs to treat it as a capability probe result, not as something to retry or correct. Nothing in the
      documentation explains it; it exists only in the spec.
